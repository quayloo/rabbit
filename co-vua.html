<title>Cờ Vua Cùng Cú Bông</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800&display=swap">
<style>
/* Layout: one phone-first column — mascot speaks in a bubble above a wooden-framed board; candy buttons below. Single bright theme on purpose (kids app). */
:root{
  --sky:#DDF0FF; --cloud:#FFFFFF; --ink:#30285A; --ink-soft:#655D8E;
  --tangerine:#FF8A3D; --tangerine-d:#D9661C; --sun:#FFC93C; --sun-d:#E7A400;
  --leaf:#3DBB7E; --leaf-d:#26935D; --berry:#FF5C8A; --lock:#C9C3DD; --lock-d:#A39CBF;
  --sq-light:#FFF2D2; --sq-dark:#86C9A8; --frame:#B97A4A; --frame-d:#8E5A32;
  --lane:rgba(255,201,60,.6);
  --font-display:'Baloo 2','Nunito',system-ui,sans-serif;
  --font-body:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
html,body{height:100%}
[hidden]{display:none!important}
body{
  background:var(--sky);
  background-image:
    radial-gradient(60px 26px at 12% 9%, #fff 98%, transparent),
    radial-gradient(44px 20px at 18% 7%, #fff 98%, transparent),
    radial-gradient(70px 28px at 86% 16%, #fff 98%, transparent),
    radial-gradient(40px 18px at 80% 14%, #fff 98%, transparent),
    linear-gradient(#CDE9FF, var(--sky) 40%, #EAF6FF);
  background-attachment:fixed;
  color:var(--ink); font-family:var(--font-body); font-size:16px;
  -webkit-tap-highlight-color:transparent; overflow:hidden;
}
#app{height:100%; max-width:560px; margin:0 auto; padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:max(16px, env(safe-area-inset-right,0px)); box-sizing:border-box}
.screen{height:100%; display:flex; flex-direction:column; box-sizing:border-box}
h1,h2,h3{font-family:var(--font-display); margin:0; text-wrap:balance; line-height:1.1}
button{font:inherit; color:inherit}

/* candy buttons */
.btn{font-family:var(--font-display); font-weight:800; font-size:1.2rem; border:0; cursor:pointer;
  background:var(--tangerine); color:#fff; padding:.45em 1.15em .4em; border-radius:18px;
  box-shadow:0 10px 24px rgba(91,75,196,.12); display:inline-flex; align-items:center; gap:.4em; justify-content:center;
  transition:transform .08s, box-shadow .08s; touch-action:manipulation}
.btn:active{transform:scale(.97)}
.btn:focus-visible,.ibtn:focus-visible,.node:focus-visible{outline:4px solid var(--ink); outline-offset:3px}
.btn.green{background:var(--leaf); box-shadow:0 10px 24px rgba(91,75,196,.12)}
.btn.green:active{box-shadow:0 1px 0 var(--leaf-d)}
.btn.soft{background:#fff; color:var(--ink); box-shadow:0 10px 24px rgba(91,75,196,.12)}
.btn.soft:active{box-shadow:0 1px 0 #BFD8EE}
.btn.big{font-size:1.55rem; padding:.45em 1.6em .38em}
.btn svg{width:1.05em; height:1.05em}
.btn[disabled]{opacity:.45; pointer-events:none}
.ibtn{width:46px; height:46px; border-radius:15px; border:0; background:#fff; color:var(--ink); display:grid; place-items:center; box-shadow:0 8px 20px rgba(91,75,196,.12); cursor:pointer; flex:none; touch-action:manipulation}
.ibtn:active{transform:scale(.97)}
.ibtn svg{width:24px; height:24px}
.ibtn.off{opacity:.5}

/* mascot */
.mascot{flex:none}
.mascot svg{width:100%; height:100%; overflow:visible}
.eyes{transform-origin:60px 56px; animation:blink 4.2s infinite}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.08)}}
.mascot.happy .owl-bob{animation:hop .45s ease-out 2; transform-origin:60px 120px}
.mascot.oops .owl-bob{animation:tilt .55s ease-in-out; transform-origin:60px 120px}
.mascot.happy .wing-l{animation:flapL .2s 4 alternate; transform-origin:24px 64px}
.mascot.happy .wing-r{animation:flapR .2s 4 alternate; transform-origin:96px 64px}
@keyframes hop{0%,100%{transform:translateY(0) scale(1)}40%{transform:translateY(-14px) scale(1.04,.97)}}
@keyframes tilt{0%,100%{transform:rotate(0)}25%{transform:rotate(-10deg)}60%{transform:rotate(8deg)}}
@keyframes flapL{to{transform:rotate(-35deg)}}
@keyframes flapR{to{transform:rotate(35deg)}}

/* HOME */
#home{gap:14px; overflow-y:auto; padding-block:12px 20px}
.hbar{display:flex; align-items:center; justify-content:space-between; flex:none}
.who{display:flex; align-items:center; gap:10px; border:0; background:#fff; border-radius:999px; padding:5px 16px 5px 5px; box-shadow:0 8px 20px rgba(91,75,196,.12); cursor:pointer; font:inherit; color:var(--ink); min-width:0; max-width:70%}
.who .ava{width:44px; height:44px}
.ava{display:block; flex:none; border-radius:50%; overflow:hidden}
.ava svg{width:100%; height:100%; display:block}
.whotxt{display:flex; flex-direction:column; text-align:left; min-width:0}
.whotxt b{font-family:var(--font-display); font-weight:800; font-size:1.15rem; line-height:1.1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.whotxt small{font-weight:700; color:var(--ink-soft); font-size:.78rem}
.hbtns{display:flex; gap:8px}
.medalrow{border:0; background:#FFF8E8; border-radius:16px; padding:10px 12px; cursor:pointer; font:inherit; color:var(--ink); display:flex; flex-direction:column; gap:6px; text-align:left; width:100%}
.mtitle{display:flex; justify-content:space-between; align-items:center}
.mtitle b{font-family:var(--font-display); font-weight:800; font-size:1rem}
.mtitle small{display:inline-flex; align-items:center; gap:2px; font-weight:800; color:var(--tangerine-d); font-size:.85rem}
.mtitle small svg{width:14px; height:14px}
.mscroll{display:flex; gap:6px; overflow-x:auto; padding-bottom:2px; scrollbar-width:none; align-items:center}
.mscroll::-webkit-scrollbar{display:none}
.mscroll svg{flex:none}
.mscroll em{font-style:normal; font-weight:700; color:var(--ink-soft); font-size:.85rem}
.badge{display:block; filter:drop-shadow(0 2px 0 rgba(48,40,90,.15))}
.badge.got.gold .shine{animation:shine 3.2s ease-in-out infinite}
.badge.got:not(.gold) .shine{animation:shine 5s ease-in-out infinite; opacity:.35}
@keyframes shine{0%,60%{transform:translateX(-60px) rotate(25deg)}85%,100%{transform:translateX(80px) rotate(25deg)}}
.badge .spark path{animation:twinkle 1.6s ease-in-out infinite; transform-box:fill-box; transform-origin:center}
.badge .spark .s2{animation-delay:.5s}
.badge .spark .s3{animation-delay:1s}
.bigbadge{animation:badgeIn .9s cubic-bezier(.34,1.5,.6,1); filter:drop-shadow(0 8px 0 rgba(48,40,90,.15))}
.bigbadge .badge{filter:none}
@keyframes badgeIn{0%{transform:scale(.2) rotate(-25deg); opacity:0}60%{transform:scale(1.1) rotate(6deg); opacity:1}100%{transform:scale(1) rotate(0)}}
.tier{font-style:normal; font-weight:800; font-size:.68rem; padding:1px 8px; border-radius:999px; color:#fff; letter-spacing:.03em}
.tier.t1{background:#C77A3E}
.tier.t2{background:#8B95AA}
.tier.t3{background:#E0A100}
.card p .tier{font-size:.9rem; padding:3px 12px}
.bgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(78px,1fr)); gap:8px; width:100%}
.bcell{border:0; background:none; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:3px; font:inherit; color:var(--ink); padding:4px 0}
.bcell span{font-weight:800; font-size:.72rem; line-height:1.15; text-align:center}
.card{max-height:calc(100dvh - 40px); overflow-y:auto}
.card .sectitle{align-self:flex-start}
.rank{display:flex; flex-direction:column; gap:8px; width:100%}
.rrow{display:flex; align-items:center; gap:10px; background:#F6F4FC; border-radius:16px; padding:8px 12px 8px 8px; text-align:left}
.rrow.me{background:#FFF1DE; box-shadow:inset 0 0 0 3px var(--tangerine)}
.rpos{width:30px; height:30px; border-radius:50%; background:#E3E0EE; display:grid; place-items:center; font-family:var(--font-display); font-weight:800; flex:none}
.rrow .ava{width:42px; height:42px}
.rname{flex:1; min-width:0; display:flex; flex-direction:column}
.rname b{font-family:var(--font-display); font-weight:800; font-size:1.05rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.rname small{font-weight:700; color:var(--ink-soft); font-size:.78rem}
.rpts{font-family:var(--font-display); font-weight:800; font-size:1.3rem; color:var(--tangerine-d); text-align:right; line-height:1; font-variant-numeric:tabular-nums}
.rpts small{display:block; font-size:.7rem; color:var(--ink-soft)}
.howpts{width:100%; text-align:left; font-weight:700; color:var(--ink-soft); font-size:.85rem}
.howpts summary{cursor:pointer; font-weight:800}
.wholist{display:flex; flex-direction:column; gap:8px; width:100%}
.wrow{display:flex; align-items:center; gap:12px; border:0; border-radius:16px; background:#F6F4FC; padding:8px 14px 8px 8px; cursor:pointer; font:inherit; color:var(--ink); text-align:left}
.wrow.me{background:#FFF1DE; box-shadow:inset 0 0 0 3px var(--tangerine)}
.wrow .ava{width:46px; height:46px}
.wrow b{flex:1; font-family:var(--font-display); font-weight:800; font-size:1.1rem}
.wrow small{font-weight:800; color:var(--ink-soft)}
.fl{align-self:flex-start; font-weight:800; margin:0; color:var(--ink)}
.pfin{width:100%; box-sizing:border-box; font:inherit; font-family:var(--font-display); font-weight:800; font-size:1.3rem; padding:10px 14px; border-radius:14px; border:3px solid #D4CFE6; color:var(--ink); background:#fff}
.pfin:focus{outline:none; border-color:var(--tangerine)}
.avgrid{display:grid; grid-template-columns:repeat(5,1fr); gap:8px; width:100%}
.avpick{border:0; background:none; padding:3px; border-radius:50%; cursor:pointer; aspect-ratio:1; max-width:100%}
.avpick svg{width:100%; height:100%; display:block}
.avpick.on{box-shadow:0 0 0 4px var(--tangerine)}
.brand{display:flex; align-items:center; gap:8px; font-family:var(--font-display); font-weight:800; font-size:1.15rem}
.appicon{width:34px; height:34px; display:block}
.appicon svg{width:100%; height:100%; display:block}
.hero{display:flex; align-items:center; gap:12px; flex:none}
#home .mascot{width:96px; height:104px}
.herotext{min-width:0}
.title{font-size:1.85rem; font-weight:800; color:var(--ink); letter-spacing:-.01em}
.title span{color:var(--tangerine)}
.sub{font-size:.95rem; color:var(--ink-soft); margin:4px 0 0; line-height:1.35; font-weight:700}
.progcard{background:#fff; border-radius:24px; padding:14px 16px 16px; box-shadow:0 10px 24px rgba(91,75,196,.12); display:flex; flex-direction:column; gap:10px; flex:none}
.pctop{display:flex; justify-content:space-between; align-items:baseline; gap:8px; flex-wrap:wrap}
.pctop b{font-family:var(--font-display); font-size:1.15rem; font-weight:800}
.pctop span{font-weight:800; color:var(--ink-soft); font-size:.9rem; font-variant-numeric:tabular-nums}
.pbar{height:12px; border-radius:6px; background:#EEF3F9; overflow:hidden}
.pbar i{display:block; height:100%; border-radius:6px; background:linear-gradient(90deg,var(--leaf),#7FD6A6)}
.medals{display:flex; flex-wrap:wrap; gap:4px}
.medal-mini{width:26px; height:26px; border-radius:50%; background:var(--sun); border:2px solid #fff; box-shadow:0 4px 10px rgba(91,75,196,.12); display:grid; place-items:center}
.medals .more{font-weight:800; font-size:.8rem; color:var(--ink-soft); align-self:center; margin-left:4px}
#startBtn{align-self:stretch; font-size:1.25rem}
.tiles{display:grid; grid-template-columns:1fr 1fr; gap:12px; flex:none}
.tile{border:0; border-radius:22px; padding:14px 12px; text-align:left; cursor:pointer; font:inherit; color:#fff; display:flex; flex-direction:column; gap:6px; min-width:0}
.tile:active{transform:translateY(4px)}
.tile .tic{width:40px; height:40px; border-radius:12px; background:rgba(255,255,255,.25); display:grid; place-items:center}
.tile .tic svg{width:24px; height:24px}
.tile b{font-family:var(--font-display); font-weight:800; font-size:1.1rem; line-height:1.1}
.tile small{font-weight:700; font-size:.82rem; opacity:.95}
#practiceBtn{background:var(--tangerine); box-shadow:0 10px 24px rgba(91,75,196,.12)}
#playBtn{background:var(--leaf); box-shadow:0 10px 24px rgba(91,75,196,.12)}
.setrow{display:flex; align-items:center; justify-content:space-between; gap:12px; width:100%; padding:8px 0; border-bottom:1px solid #EEF0F6; font-weight:800; text-align:left}
.setrow:last-child{border-bottom:0}
.setrow small{display:block; font-weight:700; color:var(--ink-soft); font-size:.8rem}
.sw{width:52px; height:30px; border-radius:15px; background:#D9D5E8; border:0; position:relative; cursor:pointer; flex:none; transition:background .2s}
.sw::after{content:""; position:absolute; left:3px; top:3px; width:24px; height:24px; border-radius:50%; background:#fff; box-shadow:0 1px 3px rgba(0,0,0,.25); transition:left .2s}
.sw.on{background:var(--leaf)}
.sw.on::after{left:25px}
.setgroup{width:100%; text-align:left}
.setgroup h4{margin:6px 0 2px; font-family:var(--font-display); font-size:.95rem; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.05em}
.medal-mini svg{width:78%; height:78%}
.settings{display:flex; gap:10px; justify-content:center; flex-wrap:wrap}
.chip{font-family:var(--font-display); font-weight:700; font-size:1rem; border:0; border-radius:999px; padding:.35em .95em .3em; background:#fff; color:var(--ink); box-shadow:0 6px 15px rgba(91,75,196,.12); cursor:pointer; display:inline-flex; gap:.35em; align-items:center}
.chip svg{width:18px; height:18px}
.chip.off{opacity:.55; text-decoration:line-through}
.note{font-size:.85rem; color:var(--ink-soft); max-width:34ch; line-height:1.4; margin:0 auto}

/* MAP */
#map{padding-block:12px 0}
.topbar{display:flex; align-items:center; gap:10px; flex:none}
.topbar h2{flex:1; font-size:1.45rem; font-weight:800}
.starcount{font-family:var(--font-display); font-weight:800; font-size:1.15rem; background:#fff; border-radius:999px; padding:.25em .8em .15em .55em; display:inline-flex; align-items:center; gap:.3em; box-shadow:0 8px 20px rgba(91,75,196,.12); font-variant-numeric:tabular-nums}
.starcount svg{width:22px; height:22px}
.maplist{flex:1; overflow-y:auto; overflow-x:hidden; margin-top:8px; padding-bottom:30px}
#mapPath{position:relative; width:100%}
#mapPath svg.trail{position:absolute; inset:0; width:100%; height:100%; pointer-events:none}
.node{position:absolute; width:88px; height:88px; transform:translateX(-50%); border-radius:50%; border:5px solid #fff; background:var(--tangerine); box-shadow:0 10px 24px rgba(91,75,196,.12); cursor:pointer; display:grid; place-items:center; padding:0}
.node svg{width:62px; height:62px}
.node.done{background:var(--leaf); box-shadow:0 10px 24px rgba(91,75,196,.12)}
.node.locked{background:var(--lock); box-shadow:0 10px 24px rgba(91,75,196,.12)}
.node.locked svg.pc{opacity:.35}
.node .lk{position:absolute; right:-6px; bottom:-4px; width:30px; height:30px; background:#fff; border-radius:50%; display:grid; place-items:center; box-shadow:0 4px 10px rgba(91,75,196,.12)}
.node .lk svg{width:18px; height:18px}
.node.current::after{content:""; position:absolute; inset:-14px; border-radius:50%; border:4px solid var(--sun); animation:ring 1.4s ease-out infinite}
@keyframes ring{0%{transform:scale(.85); opacity:1}100%{transform:scale(1.25); opacity:0}}
.nlabel{position:absolute; transform:translateX(-50%); width:150px; text-align:center; pointer-events:none}
.nlabel b{display:block; font-family:var(--font-display); font-size:1.08rem; font-weight:800; line-height:1.05}

<script>
// ===== CORE =====
const NAME={K:'Vua',Q:'Hậu',R:'Xe',B:'Tượng',N:'Mã',P:'Tốt'};
const S=s=>(s.charCodeAt(0)-97)+(+s[1]-1)*8;
const SN=i=>'abcdefgh'[i%8]+((i>>3)+1);
const fileOf=i=>i%8, rankOf=i=>i>>3;
const isLight=i=>(fileOf(i)+rankOf(i))%2===1;
let _pid=1;
function makeBoard(pos,castle){
  const b=new Array(64).fill(null); b.cr=castle||''; b.ep=-1;
  for(const k in (pos||{})){ const v=pos[k]; b[S(k)] = v==='X'?{t:'X',c:'x',id:_pid++}:{c:v[0],t:v[1],id:_pid++}; }
  return b;
}
const START=(()=>{ const p={}, back='RNBQKBNR'; for(let f=0;f<8;f++){ const F='abcdefgh'[f]; p[F+'1']='w'+back[f]; p[F+'2']='wP'; p[F+'7']='bP'; p[F+'8']='b'+back[f]; } return p; })();
const rankSq=r=>[...'abcdefgh'].map(f=>f+r);
const fileSq=f=>[1,2,3,4,5,6,7,8].map(r=>f+r);
const diagA1=()=>[0,1,2,3,4,5,6,7].map(i=>'abcdefgh'[i]+(i+1));
const ORTH=[[1,0],[-1,0],[0,1],[0,-1]], DIAG=[[1,1],[1,-1],[-1,1],[-1,-1]],
      KN=[[1,2],[2,1],[-1,2],[-2,1],[1,-2],[2,-1],[-1,-2],[-2,-1]];
function moves(b,s){
  const p=b[s]; if(!p||p.c==='x') return [];
  const f=fileOf(s), r=rankOf(s), out=[];
  const okSq=(nf,nr)=>nf>=0&&nf<8&&nr>=0&&nr<8;
  const enemy=q=>q && q.c!==p.c && q.c!=='x';
  const slide=dirs=>{ for(const[df,dr] of dirs){ let nf=f+df, nr=r+dr; while(okSq(nf,nr)){ const i=nf+nr*8, q=b[i]; if(!q) out.push(i); else { if(enemy(q)) out.push(i); break; } nf+=df; nr+=dr; } } };
  const step=dirs=>{ for(const[df,dr] of dirs){ const nf=f+df, nr=r+dr; if(okSq(nf,nr)){ const i=nf+nr*8, q=b[i]; if(!q||enemy(q)) out.push(i); } } };
  switch(p.t){
    case 'R': slide(ORTH); break;
    case 'B': slide(DIAG); break;
    case 'Q': slide(ORTH); slide(DIAG); break;
    case 'K': step(ORTH); step(DIAG);
      if(p.c==='w' && s===4 && b.cr && !attacked(b,4,'b')){
        if(b.cr.includes('K') && b[7]&&b[7].t==='R'&&b[7].c==='w' && !b[5]&&!b[6] && !attacked(b,5,'b')&&!attacked(b,6,'b')) out.push(6);
        if(b.cr.includes('Q') && b[0]&&b[0].t==='R'&&b[0].c==='w' && !b[1]&&!b[2]&&!b[3] && !attacked(b,3,'b')&&!attacked(b,2,'b')) out.push(2);
      }
      break;
    case 'N': step(KN); break;
    case 'P': {
      const d=p.c==='w'?1:-1, home=p.c==='w'?1:6, r1=r+d;
      if(r1>=0&&r1<8){

function sayNotation(s){
  if(s.startsWith('O-O-O')) return 'nhập thành cánh Hậu'+(s.endsWith('#')?', chiếu hết':s.endsWith('+')?', chiếu':'');
  if(s.startsWith('O-O')) return 'nhập thành cánh Vua'+(s.endsWith('#')?', chiếu hết':s.endsWith('+')?', chiếu':'');
  const nm={V:'Vua ',H:'Hậu ',X:'Xe ',T:'Tượng ',M:'Mã '}; let out=''; const m=s.match(/^([VHXTM]?)([a-h1-8]?)(x?)([a-h][1-8])(=H)?([+#]?)$/);
  if(!m) return s; out+=m[1]?nm[m[1]]:'Tốt '; if(m[3]) out+='ăn '; out+=m[4].split('').join(' '); if(m[5]) out+=', phong Hậu'; if(m[6]==='+') out+=', chiếu'; if(m[6]==='#') out+=', chiếu hết'; return out;
}

const rndSq=(rnd,avoid)=>{ let s; do{ s=Math.floor(rnd()*64); }while(avoid&&avoid.has(s)); return s; };
function makePuzzle(theme,lvl=1,rnd=Math.random,idx){
  const pickB=a=>a[Math.floor(rnd()*a.length)];
  if(theme==='move'){
    const cfg=[null,{p:['R','B'],r:[0,0],s:[2,2],par:[2,2]},{p:['Q','K'],r:[0,0],s:[3,3],par:[2,3]},{p:['N'],r:[0,0],s:[2,3],par:[2,3]},{p:['R','B','Q'],r:[2,3],s:[3,4],par:[4,5]},{p:['N'],r:[0,1],s:[4,4],par:[5,7]},{p:['N','Q','R'],r:[2,4],s:[5,5],par:[5,9]}].at(lvl);
    const t0 = idx==null ? pickB(cfg.p) : cfg.p.at(idx%cfg.p.length);
    for(let tr=0;tr<600;tr++){
      const t=t0, used=new Set(), pos={};
      const from=rndSq(rnd,used); used.add(from); pos[SN(from)]='w'+t;
      if(t==='K'){ // Vua đi chậm: đặt sao quanh Vua
        const near=[]; for(let i=0;i<64;i++) if(i!==from&&cheb(i,from)<=3) near.push(i);
        const ns=cfg.s[0], stars=[]; while(stars.length<ns){ const q=near.at(Math.floor(rnd()*near.length)); if(!used.has(q)){ used.add(q); stars.push(SN(q)); } }
        const sol=solveTour(makeBoard(pos),from,stars.map(S),false); if(!sol||sol.par<3||sol.par>6) continue;
        return {type:'stars', pos, stars, say:'Giúp quân *Vua* nhặt hết ngôi sao. Vua đi từng ô một nhé!'};
      }
      const nr=cfg.r[0]+Math.floor(rnd()*(cfg.r[1]-cfg.r[0]+1)); for(let i=0;i<nr;i++){ const r=rndSq(rnd,used); used.add(r); pos[SN(r)]='X'; }
      const ns=cfg.s[0]+Math.floor(rnd()*(cfg.s[1]-cfg.s[0]+1)), stars=[]; for(let i=0;i<ns;i++){ const st=rndSq(rnd,used); used.add(st); stars.push(SN(st)); }
      const sol=solveTour(makeBoard(pos),from,stars.map(S),false); if(!sol||sol.par<cfg.par[0]||sol.par>cfg.par[1]) continue;
      return {type:'stars', pos, stars, say:`Giúp quân *${NAME[t]}* nhặt hết ngôi sao, đi ít bước nhất nhé!`};
    }
  }
  if(theme==='square'){
    if(lvl===3) return {type:'nameSq', rounds:5, hideCoords:true, say:'Ô sáng màu tên là gì?'};
    const sq=new Set(); while(sq.size<(lvl===1?5:6)) sq.add(SN(rndSq(rnd))); return {type:'findSq', squares:[...sq], hideCoords:lvl===2, say:'Chạm vào ô Cú Bông đọc nhé!'};
  }
  if(theme==='write'){
    for(let tr=0;tr<300;tr++){
      const src=pickB(BANK.free.concat(BANK.escape)); const pos=fenPos(src.f); const b=makeBoard(pos);
      const ms=allMoves(b,'w').map(m=>({m, s:san(b,m[0],m[1])}));
      const ok=ms.filter(x=> lvl===1 ? !/[x+#]/.test(x.s) : lvl===2 ? x.s.includes('x')&&!/[+#]/.test(x.s) : /[+#]/.test(x.s));
      if(!ok.length) continue; const x=pickB(ok); return {type:'writeNotation', pos, target:SN(x.m[0])+SN(x.m[1]), say:'Trắng vừa đi một nước. Bé *viết ký hiệu* nước đó nhé!'};
    }
  }
  if(theme==='notation'){
    for(let tr=0;tr<300;tr++){
      const src=pickB(BANK.free.concat(BANK.escape,BANK.win)); const pos=fenPos(src.f); const b=makeBoard(pos);
      const ms=allMoves(b,'w').map(m=>({m, s:san(b,m[0],m[1])}));
      const ok=ms.filter(x=> lvl===1 ? !/[x+#]/.test(x.s) : lvl===2 ? x.s.includes('x')&&!/[+#]/.test(x.s) : /[+#]/.test(x.s));
      if(!ok.length) continue; const x=pickB(ok); return {type:'playNotation', pos, target:SN(x.m[0])+SN(x.m[1]), say:'Đi đúng nước Cú Bông viết nhé!'};
    }
  }
  const pool=BANK[theme].filter(x=>x.d===lvl); const realPool=pool.filter(x=>x.r), genPool=pool.filter(x=>!x.r);
  const it=pickB(realPool.length&&(!genPool.length||rnd()<0.7)?realPool:(genPool.length?genPool:BANK[theme])); const pos=fenPos(it.f);
  const REAL='Thế cờ từ *ván đấu thật*! ';
  if(it.line && (theme==='win'||theme==='mate3')) return {type:'seq', pos, castle:it.cr||'', ep:it.ep, line:it.line, mate:!!it.mate, real:true,
    say: REAL+(it.mate ? `Chiếu hết trong *${Math.ceil(it.line.length/2)} nước*!` : it.line.length>1 ? `Tìm nước hay nhất để *thắng quân*. Cần đi đúng ${Math.ceil(it.line.length/2)} nước!` : 'Tìm nước hay nhất để *thắng quân*!')};
  if(it.r && theme==='mate1') return {type:'mate', pos, castle:it.cr||'', ep:it.ep, real:true, say:REAL+'Tìm nước *chiếu hết*!'};
  if(it.r && theme==='mate2') return {type:'mate2', pos, castle:it.cr||'', ep:it.ep, real:true, say:REAL+'Chiếu hết trong *2 nước*. Đen sẽ tự chống đỡ!'};
  if(theme==='mate1') return {type:'mate', pos, say:'Tìm nước *chiếu hết*!'};
  if(theme==='free') return {type:'freeCapture', pos, say:'Ăn một quân đen *miễn phí*. Cẩn thận quân có bảo vệ!'};
  if(theme==='escape'){ const tp=pos[it.t][1]; return {type:'escape', pos, target:it.t, say:`Quân *${NAME[tp]}* đang bị dọa! Cho nó chạy tới *ô an toàn*.`}; }
  if(theme==='win') return {type:'win', pos, keys:it.k, say:'Tìm nước *thắng quân*! Thử nghĩ tới nước chiếu, ăn quân, bắt đôi.'};
  if(theme==='mate2') return {type:'mate2', pos, say:'Chiếu hết trong *2 nước*. Đen sẽ tự chống đỡ!'};
  if(theme==='mate3') return {type:'mate3', pos, keys:it.k, say:'Chiếu hết trong *3 nước*! Mẹo: *chiếu liên tục*, không cho Vua đen nghỉ.'};
}

function normP(p){ p=p||{}; p.done=p.done||{}; if(p.sound===undefined) p.sound=true; if(p.voice===undefined) p.voice=true; if(p.unlockAll===undefined) p.unlockAll=false;
  p.srs=p.srs||{}; p.daily=p.daily||{last:'', streak:0, best:0, days:[]}; if(p.daily.total===undefined) p.daily.total=(p.daily.days||[]).length;
  p.lv=p.lv||{}; p.speed=p.speed||{}; p.best=p.best||{}; p.freeWins=p.freeWins||{}; return p; }
const newId=()=>'p'+Date.now().toString(36)+Math.floor(Math.random()*1e4).toString(36);
let STORE=null;
try{ STORE=JSON.parse(localStorage.getItem(KEY2)); }catch(e){ STORE=null; }
if(!STORE||!Array.isArray(STORE.profiles)||!STORE.profiles.length){
  let old={}; try{ old=JSON.parse(localStorage.getItem(KEY))||{}; }catch(e){ old={}; }
  const id=newId(); STORE={v:2, active:id, profiles:[{id, name:'', avatar:'owl', data:old}]};

function tone(freq,t0,dur,type='sine',vol=.2,slide){
  if(!P.sound) return; const a=ac(); if(!a) return;
  const t=a.currentTime+t0, o=a.createOscillator(), g=a.createGain();
  o.type=type; o.frequency.setValueAtTime(freq,t); if(slide) o.frequency.exponentialRampToValueAtTime(slide,t+dur);
  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+0.015); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t+dur+0.05);
}

/* ---------- confetti ---------- */
function confetti(){
  const cv=$('#confetti'), ctx=cv.getContext('2d'); const W=cv.width=innerWidth, H=cv.height=innerHeight;
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const cols=['#FFC93C','#FF8A3D','#3DBB7E','#FF5C8A','#7FB8FF','#B69CFF'];
  const ps=Array.from({length:110},()=>({x:W/2+(Math.random()-.5)*W*.3, y:H*.35, vx:(Math.random()-.5)*12, vy:-Math.random()*13-4, s:6+Math.random()*7, r:Math.random()*6, vr:(Math.random()-.5)*.4, c:pick(cols), sh:Math.random()<.5}));
  let t=0; (function f(){ ctx.clearRect(0,0,W,H); t++;
    ps.forEach(p=>{ p.vy+=.35; p.vx*=.99; p.x+=p.vx; p.y+=p.vy; p.r+=p.vr; ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.r); ctx.fillStyle=p.c; if(p.sh){ ctx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2); } else { ctx.beginPath(); ctx.arc(0,0,p.s/2.4,0,6.3); ctx.fill(); } ctx.restore(); });
    if(t<140) requestAnimationFrame(f); else ctx.clearRect(0,0,W,H); })();
}

    const i=col+(7-row)*8, d=document.createElement('div');
    d.className='sq '+(isLight(i)?'l':'d'); d.dataset.sq=i;

function drawBoard(api,st){

function recordSRS(theme,ok){
  if(!theme) return; const r=P.srs[theme]||{box:0,due:today()};
  r.box = ok ? Math.min(5,r.box+1) : 1; r.due=addDays(today(), INTERVAL.at(r.box)); P.srs[theme]=r; save();
}
function pickDaily(){
  const un=THEMES.filter(themeUnlocked); if(!un.length) return [];
  const t0=today(); const due=un.filter(t=>!P.srs[t.id]||P.srs[t.id].due<=t0).sort((a,b)=>((P.srs[a.id]||{box:0}).box)-((P.srs[b.id]||{box:0}).box));
  const out=[]; const cnt={};
  const add=t=>{ if((cnt[t.id]||0)>=2) return false; cnt[t.id]=(cnt[t.id]||0)+1; out.push(t.id); return true; };
  due.forEach(t=>{ if(out.length<6) add(t); });
  let guard=0; while(out.length<6 && guard++<100){ add(un.at(Math.floor(Math.random()*un.length))); }
  return out.sort(()=>Math.random()-.5);
}
P.lv=P.lv||{};
const lvInfo=id=>P.lv[id]||(P.lv[id]={open:1, stars:{}});
function dailyLevel(id){ const li=lvInfo(id), box=(P.srs[id]||{box:0}).box; return box<=1 ? Math.max(1,li.open-1) : li.open; }
function startPractice(kind,themeId,lvl){
  const ids = kind==='daily' ? pickDaily() : Array(6).fill(themeId);
  if(!ids.length){ toast('Bé học xong vài bài trên bản đồ để mở phần luyện tập nhé!'); return; }
  const ex=ids.map((id,k)=>{ const l = kind==='daily' ? dailyLevel(id) : lvl; return Object.assign(makePuzzle(id,l,Math.random,kind==='daily'?undefined:k),{theme:id, lvl:l}); });
  const th=THEMES.find(t=>t.id===themeId);
  const title = kind==='daily' ? 'Câu đố hôm nay' : `${th.name} · Mức ${lvl}`;
  L={i:-1, les:{id:'practice', title, intro:[], ex}, step:0, practice:kind, results:[], theme:themeId, lvl};
  show('lesson');
  $('#lsOwl').innerHTML=owlSVG(); $('#lsClose').innerHTML=IC.close; $('#sayAgain').innerHTML=IC.speaker; $('#lsFs').innerHTML=IC.fs;
  BOARD=createBoard($('#board'), onTap);
  renderStep();
}
function practiceDone(){
  const ok=L.results.filter(Boolean).length, n=L.les.ex.length;
  let streakMsg='';
  if(L.practice==='daily'){
    const d=P.daily, t=today();
    if(d.last!==t){ d.streak = d.last===addDays(t,-1) ? d.streak+1 : 1; d.best=Math.max(d.best||0,d.streak); d.last=t; d.total=(d.total||0)+1; d.days=(d.days||[]).concat(t).slice(-30); save(); }
    streakMsg=`Chuỗi học: *${d.streak} ngày* liên tiếp!`;
  }
  if(L.practice==='level'){
    const th=THEMES.find(t=>t.id===L.theme), li=lvInfo(L.theme), lv=L.lvl;
    const st = ok>=6?3 : ok>=5?2 : ok>=4?1 : 0, pass=st>0;
    if(pass){ li.stars[lv]=Math.max(li.stars[lv]||0,st); const opened = lv===li.open && lv<th.levels; if(opened) li.open=lv+1; save();
      SFX.badge(); confetti();
      const msg = opened ? `Đúng ${ok}/${n} câu. Bé đã mở *Mức ${lv+1}*: ${LEVEL_NOTE[L.theme].at(lv)}!` : lv===th.levels ? `Đúng ${ok}/${n} câu. Bé đã qua *mức cao nhất* của chủ đề này. Siêu quá!` : `Đúng ${ok}/${n} câu. Giỏi lắm!`;
      speak(plain(msg));
      overlay(`<h3>Qua mức ${lv}!</h3><div class="bigstars">${[0,1,2].map(i=>i<st?STAR_SVG:STAR_EMPTY).join('')}</div><p>${rich(msg)}</p><div class="row"><button class="btn soft" id="ovPr">Về Luyện tập</button>${lv<th.levels?`<button class="btn green" id="ovMore">Mức ${lv+1} ${IC.next}</button>`:''}</div>`);
      [...document.querySelectorAll('.bigstars svg')].forEach((el,i)=>setTimeout(()=>el.classList.add('in'),200+i*250));
      if(lv<th.levels) $('#ovMore').onclick=()=>{ SFX.tap(); closeOverlay(); startPractice('level',L.theme,lv+1); };
    } else {
      SFX.wrong(); const msg=`Đúng ${ok}/${n} câu. Cần đúng ngay lần đầu và kịp giờ *4 câu* để qua mức này. Mình thử lại nhé!`; speak(plain(msg));
      overlay(`<h3>Gần được rồi!</h3><p>${rich(msg)}</p><div class="row"><button class="btn soft" id="ovPr">Về Luyện tập</button><button class="btn green" id="ovMore">${IC.redo} Thử lại</button></div>`);
      $('#ovMore').onclick=()=>{ SFX.tap(); closeOverlay(); startPractice('level',L.theme,lv); };
    }
    $('#ovPr').onclick=()=>{ SFX.tap(); closeOverlay(); openPractice(); };
    return;
  }
  SFX.badge(); confetti();
  const msg=`Bé làm đúng ngay lần đầu ${ok}/${n} câu. ${streakMsg}`;
  speak(plain(msg));
  overlay(`<div class="medal">${STAR_SVG}</div><h3>Xong rồi!</h3><p>${rich(msg)}</p><div class="row"><button class="btn soft" id="ovPr">Về Luyện tập</button><button class="btn green" id="ovMore">Làm thêm</button></div>`);
  $('#ovPr').onclick=()=>{ SFX.tap(); closeOverlay(); openPractice(); };
  $('#ovMore').onclick=()=>{ SFX.tap(); closeOverlay(); startPractice('daily'); };
}
function pickThemeLevel(t){
  const li=lvInfo(t.id);
  let h=`<h3>${t.name}</h3><p>Qua mỗi mức bằng cách làm đúng ngay lần đầu, kịp giờ, 4/6 câu.</p><div class="levels">`;
  for(let l=1;l<=t.levels;l++){ const open=l<=li.open, st=li.stars[l]||0;
    h+=`<button class="lvl ${open?'':'lock'}" data-l="${l}"><b>Mức ${l} ${open?`<span class="lvst">${[0,1,2].map(i=>i<st?IC.star:`<svg viewBox="0 0 100 100"><polygon points="50,7 62,37 94,38 69,58 78,90 50,72 22,90 31,58 6,38 38,37" fill="#E9E5F5"/></svg>`).join('')}</span>`:''}</b><span>${open?LEVEL_NOTE[t.id].at(l-1)+(P.timer!==false?` · ${timeFor(t.id,l)} giây/câu`:''):'Qua mức '+(l-1)+' để mở'}</span></button>`; }
  h+=`</div><button class="linkbtn" id="lvClose">Để sau</button>`;
  overlay(h);
  document.querySelectorAll('.lvl[data-l]').forEach(b=>b.onclick=()=>{ const l=+b.dataset.l; if(l>li.open){ SFX.wrong(); toast(`Bé qua mức ${l-1} trước nhé!`); return; } SFX.tap(); closeOverlay(); startPractice('level',t.id,l); });
  $('#lvClose').onclick=()=>{ SFX.tap(); closeOverlay(); };
}

/* intro cards with looping demo */
function stopDemo(){ clearTimeout(demoT); demoT=null; stopTimer(); stopCountdown(); const tb=$('#tbar'); if(tb) tb.hidden=true; }
function renderIntro(card){
  setSay(card.say);
  $('#info').textContent=`Bài ${L.i+1} · ${L.les.title}`;
  const d=card.demo||{pos:{}};
  const b0=makeBoard(d.pos,d.castle);
  const stars0=(d.stars||[]).map(s=>({sq:S(s),id:'d'+_pid++}));
  const focusSq = d.moves? S(d.moves[0][0]) : d.dotsAt? S(d.dotsAt) : -1;
  const focusId = focusSq>=0 && b0[focusSq] ? b0[focusSq].id : null;
  const frames=[{b:b0, stars:stars0, last:null}];
  (d.moves||[]).forEach(([f,t])=>{ const prev=frames[frames.length-1]; const nb=applyMove(prev.b,S(f),S(t)); frames.push({b:nb, stars:prev.stars.filter(s=>s.sq!==S(t)), last:[S(f),S(t)]}); });
  const drawFrame=k=>{
    const fr=frames[k]; const fs = (d.dots||d.dotsAt) && focusId!=null ? fr.b.findIndex(p=>p&&p.id===focusId) : -1;
    drawBoard(BOARD,{board:fr.b, stars:fr.stars, mark:(d.mark||[]).map(S), last:fr.last, dots: fs>=0? moves(fr.b,fs):[], sel: fs>=0&&frames.length>1? fs : null});
  };
  BOARD.el.classList.add('noanim'); drawFrame(0); requestAnimationFrame(()=>BOARD.el.classList.remove('noanim'));
  if(frames.length>1){
    let k=0;
    const tick=()=>{ k++; if(k<frames.length){ drawFrame(k); const fr=frames[k]; const cap=frames[k-1].b[fr.last[1]]; cap?SFX.capture():tone(420,0,.08,'sine',.08,560); if(frames[k-1].stars.length>fr.stars.length) SFX.star(); demoT=setTimeout(tick, k===frames.length-1?1800:1150); }
      else { k=0; BOARD.el.classList.add('noanim'); drawFrame(0); requestAnimationFrame(()=>BOARD.el.classList.remove('noanim')); demoT=setTimeout(tick,1100); } };
    demoT=setTimeout(tick,1300);
  }
  const n=L.les.intro.length, last=L.step===n-1, seen=lessonDone(L.les);
  const c=$('#ctrls'); c.innerHTML='';
  if(L.step>0) addBtn(c,`${IC.prev} Lùi`,'soft',()=>{ L.step--; renderStep(); });
  addBtn(c, last?`Luyện tập thôi ${IC.next}`:`Tiếp ${IC.next}`, last?'green':'', ()=>{ L.step++; renderStep(); });
  if(seen && !last) addBtn(c,'Vào luyện tập','soft',()=>{ L.step=n; renderStep(); });
}
function addBtn(c,html,cls,fn){ const b=document.createElement('button'); b.className='btn '+cls; b.innerHTML=html; b.onclick=()=>{ ac(); SFX.tap(); fn(); }; c.appendChild(b); return b; }

/* exercises */
function later(fn,ms){ const myE=E; return setTimeout(()=>{ if(E===myE) fn(); },ms); }
const MOVE_TYPES=['seq','mate3','win','playNotation','stars','capture','check','mate','promote','captureAll','pick','freeCapture','escape','defend','line','play','mate2','game'];
const SINGLE=['capture','check','mate','pick','freeCapture','escape','defend'];
function startExercise(k,keep){
  const ex=L.les.ex[k];
  E={k, ex, stage:3, board:(()=>{ const bb=makeBoard(ex.pos,ex.castle); if(ex.ep&&ex.ep!=='-'){ bb.ep=S(ex.ep); bb.epBy='b'; } return bb; })(), stars:[], moves:0, mistakes:keep?keep.mistakes:0, hinted:keep?keep.hinted:false, sel:null, dots:[], hint:[], last:null, busy:false, done:false, par:null, li:0, phase:0, hist:[]};
  if(ex.type==='tapStars'){
    E.stars=[...ex.stars.map(s=>({sq:S(s),id:'s'+_pid++,good:true})), ...ex.decoys.map(s=>({sq:S(s),id:'s'+_pid++,good:false}))];
  }
  if(ex.type==='stars'){
    E.stars=ex.stars.map(s=>({sq:S(s),id:'s'+_pid++,good:true}));
    const from=E.board.findIndex(p=>p&&p.c==='w');
    E.par=solveTour(E.board,from,E.stars.map(s=>s.sq),false).par;
  }
  if(ex.type==='captureAll'){
    const from=E.board.findIndex(p=>p&&p.c==='w');
    E.par=solveTour(E.board,from,E.board.map((p,i)=>p&&p.c==='b'?i:-1).filter(i=>i>=0),true).par;
  }
  if(ex.type==='escape') select(S(ex.target)); else if(MOVE_TYPES.includes(ex.type)) autoSel();
  BOARD.el.classList.toggle('nocoord', !!ex.hideCoords);
  stopTimer(); stopCountdown(); $('#tbar').hidden=true;
  if(L.practice && L.practice!=='game' && P.timer!==false && ex.theme && ex.type!=='speedSq') later(()=>{ if(E&&E.ex===ex&&!E.done) startCountdown(timeFor(ex.theme,ex.lvl)); },0);
  if(ex.type==='findSq'){ E.targets=ex.squares.map(S); E.ti=0; }
  if(ex.type==='nameSq'){ E.ti=0; E.rounds=ex.rounds||5; }
  if(ex.type==='speedSq'){ E.score=0; E.left=ex.seconds||45; E.started=false; }
  if(ex.type==='playNotation'){ const t=ex.target; E.tsan=san(E.board,S(t.slice(0,2)),S(t.slice(2,4))); }
  if(ex.type==='writeNotation'){ const t=ex.target; E.tsan=san(E.board,S(t.slice(0,2)),S(t.slice(2,4))); E.typed=''; }
  setSay(ex.say);
  const c=$('#ctrls'); c.innerHTML='';
  addBtn(c,`${IC.bulb} Gợi ý`,'soft',giveHint);
  if(ex.type==='game') addBtn(c,`${IC.prev} Đi lại`,'soft',undoMove);
  addBtn(c,`${IC.redo} ${ex.type==='game'?'Ván mới':'Làm lại'}`,'soft',()=>startExercise(k));
  BOARD.el.classList.add('noanim'); redraw(); requestAnimationFrame(()=>BOARD.el.classList.remove('noanim'));
  updateInfo();
  if(ex.type==='line') lineNext();
  if(ex.type==='findSq') later(()=>promptSq(),900);
  if(ex.type==='nameSq') nameRound();
  if(ex.type==='speedSq'){ c.innerHTML=''; addBtn(c,`Bắt đầu ${IC.next}`,'green big',startSpeed); }
  if(ex.type==='writeNotation'){ E.busy=true; later(()=>{ if(!E||E.ex!==ex) return; const t=ex.target, f=S(t.slice(0,2)), to=S(t.slice(2,4)); const cp=E.board[to]; E.board=applyMove(E.board,f,to); E.last=[f,to]; cp?SFX.capture():SFX.move(); redraw(); E.busy=false; renderKeypad(); },900); }
  if(ex.type==='playNotation') later(()=>{ setSay(`Bé đi nước *${E.tsan}*`,false); speak('Bé đi nước '+sayNotation(E.tsan)); },700);
}
/* ---- write notation keypad ---- */
function renderKeypad(){
  const c=$('#ctrls'); c.innerHTML='';
  const box=document.createElement('div'); box.className='kp';
  const rows=[['V','H','X','T','M'],['a','b','c','d','e','f','g','h'],['1','2','3','4','5','6','7','8'],['x','+','#','O-O','⌫']];
  box.innerHTML=`<div class="kpshow" id="kpShow">${E.typed||'<span>Bấm để viết…</span>'}</div>`+rows.map(r=>`<div class="kprow">${r.map(k=>`<button class="kpk ${'VHXTM'.includes(k)&&k.length===1?'pc':''}" data-k="${k}">${k}</button>`).join('')}</div>`).join('')+`<div class="kprow"><button class="btn soft" id="kpHint">${IC.bulb} Gợi ý</button><button class="btn green" id="kpOk">Xong ${IC.next}</button></div>`;
  c.appendChild(box);
  box.querySelectorAll('.kpk').forEach(b=>b.onclick=()=>{ if(!E||E.done) return; ac(); SFX.tap(); const k=b.dataset.k; if(k==='⌫') E.typed=E.typed.slice(0,-1); else if(E.typed.length<9) E.typed+=k; $('#kpShow').innerHTML=E.typed||'<span>Bấm để viết…</span>'; });
  $('#kpHint').onclick=()=>{ ac(); E.hinted=true; SFX.ding(); const p=E.board[E.last[1]]; setSay(`Gợi ý: quân vừa đi là *${NAME[p.t]}*${p.t==='P'?' (Tốt không cần chữ)':', chữ *'+LETTER[p.t]+'*'}, đi đến ô *${SN(E.last[1])}*.`); };
  $('#kpOk').onclick=()=>{ if(!E||E.done) return; ac();
    if(E.typed===E.tsan){ SFX.star(); E.busy=true; return later(win,300); }
    const noSfx=E.typed.replace(/[+#]$/,'')===E.tsan.replace(/[+#]$/,'');
    wrongFeedback(noSfx ? `Gần đúng rồi! Nước này ${E.tsan.endsWith('#')?'là *chiếu hết*, cần dấu *#*':E.tsan.endsWith('+')?'có *chiếu*, cần dấu *+*':'không chiếu, bỏ dấu đi nhé'}.` : `Chưa đúng. Đáp án là *${E.tsan}*, nghĩa là ${sayNotation(E.tsan)}. Bé viết lại nhé!`);
    E.typed=''; $('#kpShow').innerHTML='<span>Bấm để viết…</span>'; };
}

/* ---- countdown timer for practice ---- */
const BASE_TIME={write:[0,30,35,45], move:[0,20,30,35,50,60,90], mate1:[0,30,40,50,60], free:[0,25,30,40,50], escape:[0,20,25,35,45], win:[0,45,60,75,90], mate2:[0,60,75,90,120], mate3:[0,120,150], square:[0,35,40,40], notation:[0,25,30,35]};
P.speed=P.speed||{};
const speedOf=th=>Math.min(1.3,Math.max(0.4,(P.speed||{})[th]||1));
function timeFor(th,lvl){ const b=(BASE_TIME[th]||[]).at(lvl||1)||40; return Math.max(8,Math.round(b*speedOf(th)/5)*5); }
let CD=null;
function stopCountdown(){ if(CD){ clearInterval(CD); CD=null; } }
function startCountdown(sec){
  stopCountdown(); E.limit=sec; E.left=sec; E.timedOut=false; E.t0=Date.now();
  const bar=$('#tbar'); bar.hidden=false; bar.className='tbar';
  const draw=()=>{ $('#tfill').style.width=Math.max(0,E.left/E.limit*100)+'%'; $('#tsec').textContent=E.timedOut?'Hết giờ':E.left+' giây'; bar.classList.toggle('warn',E.left<=E.limit*.5); bar.classList.toggle('hurry',!E.timedOut&&E.left<=Math.min(5,E.limit*.25)); bar.classList.toggle('out',E.timedOut); };
  $('#tfill').style.transition='none'; draw(); requestAnimationFrame(()=>{ $('#tfill').style.transition=''; });
  const myE=E;
  CD=setInterval(()=>{
    if(E!==myE||E.done){ stopCountdown(); return; }
    if(E.busy) return;                       // không tính giờ lúc Đen đang đi
    E.left--; draw();
    if(E.left>0 && E.left<=5) tone(880,0,.06,'square',.06);
    if(E.left<=0){ stopCountdown(); E.timedOut=true; draw(); SFX.wrong(); mood('oops'); setSay('Hết giờ rồi! Không sao, bé cứ làm tiếp nhé. Câu này chưa được tính là đúng.'); }
  },1000);
}
function updateSpeed(th,ok){
  if(!th||!E||!E.limit) return;
  const used=(Date.now()-E.t0)/1000/E.limit; let f=speedOf(th);
  if(E.timedOut) f*=1.08; else if(ok && used<0.5) f*=0.92; else if(ok) f*=0.97;
  P.speed=P.speed||{}; P.speed[th]=Math.min(1.3,Math.max(0.4,f)); save();
}

/* ---- notation & square games ---- */
let TIMER=null;
function stopTimer(){ if(TIMER){ clearInterval(TIMER); TIMER=null; } }
function sqWords(i){ const n=SN(i); return 'ô '+n[0]+' '+n[1]; }
function promptSq(){ if(!E||E.done) return; const t=E.targets.at(E.ti); setSay(`Chạm vào ô *${SN(t)}*`,false); speak(sqWords(t)); updateInfo(); }
function nameRound(){
  if(!E||E.done) return;
  const t=Math.floor(Math.random()*64); E.nameT=t; E.mark=[t]; redraw();
  const opts=new Set([t]); while(opts.size<4){ const d=[t+1,t-1,t+8,t-8,t+9,t-7,Math.floor(Math.random()*64)].filter(x=>x>=0&&x<64); opts.add(d.at(Math.floor(Math.random()*d.length))); }
  const c=$('#ctrls'); c.innerHTML='';
  [...opts].sort(()=>Math.random()-.5).forEach(o=>{ const b=addBtn(c,SN(o),'soft optbtn',()=>{
    if(o===E.nameT){ SFX.star(); E.ti++; updateInfo(); if(E.ti>=E.rounds){ E.mark=[]; redraw(); return win(); } nameRound(); }
    else { b.disabled=true; wrongFeedback(`Chưa đúng. Ô sáng màu là ô *${SN(E.nameT)}*: hàng dọc ${SN(E.nameT)[0]}, hàng ngang ${SN(E.nameT)[1]}.`); }
  }); });
  setSay('Ô sáng màu tên là gì?',false); speak('Ô sáng màu tên là gì?');
}
function startSpeed(){
  E.started=true; E.score=0; E.left=E.ex.seconds||45; E.target=Math.floor(Math.random()*64);
  const c=$('#ctrls'); c.innerHTML=''; addBtn(c,`${IC.redo} Chơi lại`,'soft',()=>startExercise(E.k));
  setSay(`Chạm vào ô *${SN(E.target)}*`,false); speak(sqWords(E.target)); updateInfo();
  const myE=E;
  TIMER=setInterval(()=>{ if(E!==myE){ stopTimer(); return; } E.left--; updateInfo(); if(E.left<=0){ stopTimer(); endSpeed(); } },1000);
}
function endSpeed(){
  P.best=P.best||{}; const prev=P.best.speed||0; if(E.score>prev){ P.best.speed=E.score; save(); }
  E.speedNote = E.score>prev && prev>0 ? `Kỷ lục mới: ${E.score} ô!` : `Bé tìm đúng ${E.score} ô. Kỷ lục: ${Math.max(prev,E.score)} ô.`;
  win();
}
function autoSel(){ let ws=E.board.map((p,i)=>p&&p.c==='w'&&p.t!=='K'?i:-1).filter(i=>i>=0); if(!ws.length) ws=E.board.map((p,i)=>p&&p.c==='w'?i:-1).filter(i=>i>=0); if(ws.length===1) select(ws[0]); else { E.sel=null; E.dots=[]; } }
function updateInfo(){
  const ex=E.ex, head=`Bài tập ${E.k+1}/${L.les.ex.length}`;
  let tail='';
  if(ex.type==='stars'||ex.type==='captureAll') tail=` · Đã đi ${E.moves} bước · Giỏi nhất: ${E.par} bước`;
  if(ex.type==='tapStars'){ const left=E.stars.filter(s=>s.good).length; tail=` · Còn ${left} ngôi sao`; }

    const sol=solveTour(E.board,from,tg,ex.type==='captureAll'); if(sol&&sol.path[1]!=null){ select(from); E.hint=[sol.path[1]]; }
  }
  else if(ex.type==='promote'){ const from=E.board.findIndex(p=>p&&p.c==='w'); const mv=legal(E.board,from); select(from); E.hint=[mv[mv.length-1]]; }
  else if(ex.type==='line'){ const st=ex.steps[E.li]; if(st&&st.w){ select(S(st.w[0].slice(0,2))); E.hint=[S(st.w[0].slice(2,4))]; } }
  else if(ex.type==='play'){ const m=hintPlay(E.board,ex.goal); if(m){ select(m[0]); E.hint=[m[1]]; } }
  else if(ex.type==='game'){ if(E.lost) return; const m=mateIn1(E.board)||bestMove(E.board,'w',2).move; if(m){ select(m[0]); E.hint=[m[1]]; } }
  else if(ex.type==='findSq'){ E.hint=[E.targets.at(E.ti)]; }
  else if(ex.type==='speedSq'||ex.type==='nameSq'){ toast('Trò này không có gợi ý đâu nhé!'); E.hinted=false; return; }
  else if(ex.type==='playNotation'){ const t=ex.target; select(S(t.slice(0,2))); E.hint=[S(t.slice(2,4))]; }
  else if(ex.type==='win'){ const m = E.phase===0 ? [S(ex.keys[0].slice(0,2)),S(ex.keys[0].slice(2,4))] : bestMove(E.board,'w',3).move; if(m){ select(m[0]); E.hint=[m[1]]; } }
  else if(ex.type==='seq'){ const m=ex.line[E.li]; if(m){ select(S(m.slice(0,2))); E.hint=[S(m.slice(2,4))]; } }
  else if(ex.type==='writeNotation'){ $('#kpHint')&&$('#kpHint').click(); return; }
  else if(ex.type==='mate3'){ const st=E.stage||3; const m = st===3 ? [S(ex.keys[0].slice(0,2)),S(ex.keys[0].slice(2,4))] : (mateIn1(E.board) || allMate2(E.board)[0]); if(m){ select(m[0]); E.hint=[m[1]]; } }
  else if(ex.type==='mate2'){ const m = E.phase===0 ? allMate2(E.board)[0] : mateIn1(E.board); if(m){ select(m[0]); E.hint=[m[1]]; } }
  else if(ex.type==='pick'){ const m=ex.accept[0]; select(S(m.slice(0,2))); E.hint=[S(m.slice(2,4))]; }
  else { const sol=findSolutions(ex,E.board)[0]; if(sol){ select(sol[0]); E.hint=[sol[1]]; } }
  redraw(); SFX.ding(); setSay('Gợi ý nè: quân đã được chọn sẵn, bé chạm vào *ô đang nhấp nháy* nhé!');
}
function rate(){
  let s;
  if(E.ex.type==='speedSq') return E.score>=15?3:E.score>=8?2:1;
  if(E.par!=null) s = E.moves<=E.par?3 : E.moves<=E.par+2?2:1;
  else s = E.mistakes===0?3 : E.mistakes<=2?2:1;
  if(E.hinted) s=Math.min(s,2);
  if(E.timedOut) s=1;
  return s;
}
function win(){
  if(E.done) return; E.done=true;
  const s=rate(), id=L.les.id; const arr=P.done[id]||[]; const wasDone=lessonDone(L.les);
  if(L.free){ P.freeWins=P.freeWins||{}; P.freeWins[E.ex.level]=(P.freeWins[E.ex.level]||0)+1; save(); }
  else if(!L.practice){ arr[E.k]=Math.max(arr[E.k]||0,s); P.done[id]=arr; save(); }
  mood('happy'); SFX.win(); confetti();
  const praise=pick(PRAISE); setSay(praise);
  renderProg();
  let detail='';
  if(E.par!=null) detail = E.moves<=E.par ? `Bé chỉ đi ${E.moves} bước, ít nhất có thể luôn!` : `Bé đi ${E.moves} bước. Lần sau thử chỉ ${E.par} bước thôi nhé!`;
  else detail = E.hinted ? 'Bé làm được rồi! Lần sau thử tự làm, không cần gợi ý nhé.' : E.mistakes===0 ? 'Đúng ngay từ lần đầu tiên!' : 'Bé đã cố gắng và làm được rồi!';
  if(E.hinted && E.par!=null) detail+=' Lần sau thử không cần gợi ý nhé.';
  const lastEx=E.k===L.les.ex.length-1;
  if(E.ex.type==='speedSq') detail=E.speedNote||'';
  if(L.practice && E.limit){ const used=Math.round((Date.now()-E.t0)/1000); detail = E.timedOut ? 'Lần sau thử nhanh hơn một chút nhé!' : `Bé giải trong ${used} giây (giới hạn ${E.limit} giây). `+detail; }
  if(E.ex.type==='game') detail = E.hinted ? 'Bé thắng Cú Bông rồi! Lần sau thử thắng mà không cần gợi ý hay đi lại nhé.' : 'Bé tự mình thắng Cú Bông. Giỏi quá!';
  const myE=E;
  if(L.practice){
    stopCountdown();
    if(E.ex.theme && L.results[E.k]===undefined){ const ok=E.mistakes===0&&!E.hinted&&!E.timedOut; L.results[E.k]=ok; if(L.practice!=='game'){ recordSRS(E.ex.theme, ok); updateSpeed(E.ex.theme, ok); } }
    setTimeout(()=>{ if(E!==myE) return;
      const last=E.k===L.les.ex.length-1;
      overlay(`<h3>${praise}</h3><div class="bigstars">${[0,1,2].map(i=>i<s?STAR_SVG:STAR_EMPTY).join('')}</div><p>${detail}</p><div class="row"><button class="btn green" id="ovNext">${last?'Hoàn thành':'Câu tiếp'} ${IC.next}</button></div>`);
      [...document.querySelectorAll('.bigstars svg')].forEach((el,i)=>setTimeout(()=>el.classList.add('in'),200+i*220));
      $('#ovNext').onclick=()=>{ SFX.tap(); closeOverlay(); if(L.practice==='game'){ openPractice(); return; } if(last) practiceDone(); else { L.step++; renderStep(); } };
    },650);
    return;
  }
  if(L.free){ setTimeout(()=>{ if(E!==myE) return;
    overlay(`<h3>Bé thắng rồi!</h3><div class="medal">${CROWN_SVG}</div><p>${detail}</p><div class="row"><button class="btn soft" id="ovHome">${IC.home} Trang đầu</button><button class="btn green" id="ovAgain">Ván mới</button></div>`);
    $('#ovHome').onclick=()=>{ SFX.tap(); closeOverlay(); show('home'); renderHome(); };
    $('#ovAgain').onclick=()=>{ SFX.tap(); closeOverlay(); startExercise(0); };
  },650); return; }
  setTimeout(()=>{ if(E!==myE) return;
    overlay(`<h3>${praise}</h3><div class="bigstars">${[0,1,2].map(i=>i<s?STAR_SVG:STAR_EMPTY).join('')}</div><p>${detail}</p>
      <div class="row"><button class="btn soft" id="ovRetry">${IC.redo} Làm lại</button><button class="btn green" id="ovNext">${lastEx?'Nhận huy hiệu':'Bài tiếp'} ${IC.next}</button></div>`);
    const svgs=[...document.querySelectorAll('.bigstars svg')];
    svgs.forEach((el,i)=>setTimeout(()=>{ el.classList.add('in'); if(i<s) tone(880+i*220,0,.18,'triangle',.16); },250+i*280));
    $('#ovRetry').onclick=()=>{ SFX.tap(); closeOverlay(); startExercise(E.k); };
    $('#ovNext').onclick=()=>{ SFX.tap(); closeOverlay();
      if(lastEx){ if(lessonDone(L.les)) lessonComplete(wasDone); else { const miss=L.les.ex.findIndex((_,i)=>!(P.done[id]||[])[i]); L.step=L.les.intro.length+miss; renderStep(); toast('Còn bài tập chưa xong nè!'); } }
      else { L.step++; renderStep(); } };
  },650);
}
function lessonComplete(wasDone){
  const l=L.les, isLast=L.i===LESSONS.length-1;
  SFX.badge(); confetti(); setTimeout(confetti,700);
  const msg = isLast ? 'Bé đã biết chơi cờ vua rồi! Hãy rủ bố mẹ chơi một ván thật nhé!' : `Bé nhận được huy hiệu *${l.badge}*! Bài tiếp theo đã được mở.`;
  speak(msg);
  const bg=allBadges(P).find(x=>x.id==='l-'+l.id);
  overlay(`<div class="bigbadge">${badgeSVG(bg,160)}</div><h3>${isLast?'Nhà vô địch!':'Hoàn thành!'}</h3><p><i class="tier t${bg.tier}">Hạng ${TIER.at(bg.tier).name}</i></p><p>${rich(msg)}</p><p><span class="starcount">${starTag(lessonStars(l)+'/'+l.ex.length*3)}</span></p>
    <div class="row"><button class="btn green big" id="ovMap">Về bản đồ</button></div>`);
  $('#ovMap').onclick=()=>{ SFX.tap(); closeOverlay(); openMap(); };
}
function overlay(html){ $('#ovCard').innerHTML=html; $('#overlay').hidden=false; }
function closeOverlay(){ $('#overlay').hidden=true; }

renderHome();
</script>
