(function(){

  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',fill); else fill();

<title>Bé Ôn Tiếng Anh</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Nunito:wght@600;700;800;900&family=Noto+Color+Emoji&display=swap">
<style>
/* Layout: one phone column; Thỏ Mochi speaks from a bubble at the top of every screen; big candy cards and buttons; mint meadow ground with lilac and coral accents. Single bright theme on purpose (kids app). */
:root {
  --page: #f4f1ff;
  --page2: #ebe6ff;
  --ink: #2d2550;
  --soft: #776fa3;
  --card: #ffffff;
  --line: #e6e0ff;
  --coral: #ff7a59;
  --coral-d: #e05a3a;
  --sun: #ffc93c;
  --sun-d: #e3a600;
  --lilac: #8b7cf6;
  --lilac-d: #5b4bc4;
  --sky: #4fb3ff;
  --sky-d: #2f8fe0;
  --mint: #2fbf8a;
  --mint-d: #1f9a6e;
  --red: #ff5a6e;
  --display: "Quicksand", "Nunito", system-ui, sans-serif;
  --body: "Quicksand", "Nunito", system-ui, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { min-height: 100%; }
body {
  margin: 0; background: var(--page); color: var(--ink); font-family: var(--body); font-size: 16px;
  background-image: radial-gradient(circle at 105% -4%, #e6e0ff 0 150px, transparent 151px), radial-gradient(circle at -10% 40%, #efeaff 0 90px, transparent 91px);
  padding-left: max(14px, env(safe-area-inset-left, 0px)); padding-right: max(14px, env(safe-area-inset-right, 0px));
  -webkit-tap-highlight-color: transparent; overscroll-behavior: none;
}
button { font-family: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 3px solid var(--lilac); outline-offset: 2px; }
#app { max-width: 560px; margin: 0 auto; padding-block: 10px 30px; display: flex; flex-direction: column; gap: 14px; min-height: 100vh; }

/* top bar */
.top { display: flex; align-items: center; gap: 10px; min-height: 48px; }
.ib { width: 46px; height: 46px; border-radius: 16px; border: 0; background: var(--card); box-shadow: 0 8px 20px rgba(91,75,196,.10); display: grid; place-items: center; flex: none; font-size: 1.3rem; }
.ib:active { transform: scale(.97); }
.ib svg { width: 24px; height: 24px; }
.ttl { flex: 1; min-width: 0; font-family: var(--display); font-weight: 800; font-size: 1.3rem; line-height: 1.1; }
.ttl small { display: block; font-family: var(--body); font-weight: 700; font-size: .8rem; color: var(--soft); }
.chipc { background: var(--card); border-radius: 999px; padding: 6px 12px; font-family: var(--display); font-weight: 800; box-shadow: 0 6px 15px rgba(91,75,196,.10); white-space: nowrap; font-variant-numeric: tabular-nums; }

/* mascot */
.talk { display: flex; align-items: flex-end; gap: 6px; }
.mochi { width: 78px; height: 84px; flex: none; }
.mochi svg { width: 100%; height: 100%; overflow: visible; }
.mochi .bob { animation: bob 2.6s ease-in-out infinite; transform-origin: 50% 100%; }
.mochi.happy .bob { animation: hop .45s ease-out 2; }
.mochi.oops .bob { animation: tilt .6s ease-in-out; }
.mochi .eyes { animation: blink 4s infinite; transform-origin: 50% 50%; transform-box: fill-box; }
@keyframes bob { 50% { transform: translateY(-3px); } }
@keyframes hop { 40% { transform: translateY(-16px) scale(1.04, .96); } }
@keyframes tilt { 30% { transform: rotate(-8deg); } 70% { transform: rotate(6deg); } }
@keyframes blink { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }
.bubble { flex: 1; min-width: 0; position: relative; background: var(--card); border: 3px solid var(--ink); border-radius: 20px; padding: 9px 12px; margin-bottom: 10px; font-family: var(--display); font-weight: 700; font-size: 1.08rem; line-height: 1.3; }
.bubble::before { content: ""; position: absolute; left: -13px; bottom: 12px; border: 9px solid transparent; border-right: 12px solid var(--ink); border-left: 0; }
.bubble::after { content: ""; position: absolute; left: -8px; bottom: 14px; border: 7px solid transparent; border-right: 10px solid var(--card); border-left: 0; }
.bubble b { color: var(--coral-d); }

/* home */
.hero { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.brand { font-family: var(--display); font-weight: 800; font-size: 1.75rem; line-height: 1; letter-spacing: -.01em; }
.brand span { color: var(--coral); }
.stats { display: flex; gap: 8px; }
.today { border: 0; border-radius: 26px; padding: 18px 18px 16px; background: var(--coral); color: #fff; box-shadow: 0 10px 22px color-mix(in srgb, var(--coral-d) 35%, transparent); display: flex; align-items: center; gap: 14px; text-align: left; }
.today:active { transform: scale(.97); }
.today .play { width: 64px; height: 64px; border-radius: 50%; background: #fff; color: var(--coral); display: grid; place-items: center; flex: none; font-size: 1.9rem; padding-left: 5px; }
.today b { display: block; font-family: var(--display); font-weight: 800; font-size: 1.6rem; line-height: 1.05; }
.today small { font-weight: 800; opacity: .95; }
.vocab { background: var(--card); border-radius: 20px; padding: 12px 14px; box-shadow: 0 8px 20px rgba(91,75,196,.10); display: flex; flex-direction: column; gap: 6px; }
.vocab .row { display: flex; justify-content: space-between; align-items: baseline; font-weight: 800; }
.vocab .row b { font-family: var(--display); font-size: 1.15rem; }
.vocab .row span { color: var(--soft); font-variant-numeric: tabular-nums; }
.bar { height: 12px; border-radius: 6px; background: var(--page2); overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 6px; background: linear-gradient(90deg, var(--mint), #7de2b8); transition: width .5s; }
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.tile { border: 0; border-radius: 22px; padding: 14px 12px 12px; text-align: left; background: var(--c); color: #fff; box-shadow: 0 10px 24px rgba(91,75,196,.10); display: flex; flex-direction: column; gap: 4px; min-width: 0; position: relative; }
.tile:active { transform: scale(.97); }
.tile .ic { font-size: 2rem; line-height: 1.1; }
.tile b { font-family: var(--display); font-weight: 800; font-size: 1.12rem; line-height: 1.1; }
.tile small { font-weight: 700; font-size: .8rem; opacity: .92; }
.tile.soon { background: #cfd9e4; color: #5d6b80; box-shadow: 0 10px 24px rgba(91,75,196,.10); }
.tile.soon::after { content: "Sắp có"; position: absolute; top: 10px; right: 10px; background: #fff; color: #5d6b80; font-size: .7rem; font-weight: 900; border-radius: 999px; padding: 2px 8px; }

/* topics */
.tgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
.tcard { border: 0; border-radius: 20px; background: var(--card); box-shadow: 0 10px 24px rgba(91,75,196,.10); padding: 12px; display: flex; flex-direction: column; gap: 6px; text-align: left; position: relative; min-width: 0; }
.tcard:active { transform: scale(.97); }
.tcard .ti { width: 52px; height: 52px; border-radius: 16px; background: var(--c); display: grid; place-items: center; font-size: 1.8rem; }
.tcard b { font-family: var(--display); font-weight: 800; font-size: 1.02rem; line-height: 1.15; }
.tcard small { color: var(--soft); font-weight: 800; font-size: .78rem; font-variant-numeric: tabular-nums; }
.tcard .bar { height: 8px; }
.tcard .stk { position: absolute; top: 8px; right: 10px; font-size: 1.4rem; }
.tcard.cur { box-shadow: 0 10px 20px color-mix(in srgb, var(--c) 35%, transparent); outline: 3px solid var(--c); }

/* topic detail */
.thead { display: flex; gap: 12px; align-items: center; background: var(--card); border-radius: 22px; padding: 12px; box-shadow: 0 8px 20px rgba(91,75,196,.10); }
.thead .ti { width: 64px; height: 64px; border-radius: 18px; background: var(--c); display: grid; place-items: center; font-size: 2.2rem; flex: none; }
.thead .tx { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.thead b { font-family: var(--display); font-size: 1.25rem; line-height: 1.1; }
.legend { display: flex; gap: 10px; flex-wrap: wrap; font-size: .78rem; font-weight: 800; color: var(--soft); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 4px; vertical-align: -1px; }
.acts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.act { border: 0; border-radius: 20px; padding: 12px; background: var(--c); color: #fff; box-shadow: 0 10px 20px color-mix(in srgb, var(--d) 35%, transparent); display: flex; flex-direction: column; gap: 2px; text-align: left; }
.act:active { transform: scale(.97); }
.act .ic { font-size: 1.7rem; line-height: 1.1; }
.act b { font-family: var(--display); font-weight: 800; font-size: 1.1rem; line-height: 1.1; }
.act small { font-weight: 700; font-size: .78rem; opacity: .95; }
.act[disabled] { opacity: .45; }
.wgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; }
.wc { border: 0; border-radius: 16px; background: var(--card); box-shadow: 0 6px 15px rgba(91,75,196,.10); padding: 8px 6px; display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 0; position: relative; }
.wc .pic { height: 46px; display: grid; place-items: center; }
.wc .pic .emo { font-size: 2.2rem; }
.wc .pic .mean { font-size: .72rem; }
.wc .pic svg { width: 46px; height: 46px; }
.wc span { font-family: var(--display); font-weight: 800; font-size: .95rem; line-height: 1.1; text-align: center; overflow-wrap: anywhere; }
.wc .dot { position: absolute; top: 6px; right: 6px; width: 10px; height: 10px; border-radius: 50%; background: var(--line); }
.dot.s1 { background: var(--sun); } .dot.s2 { background: var(--sky); } .dot.s3 { background: var(--mint); } .dot.sx { background: var(--red); }
.h2 { font-family: var(--display); font-weight: 800; font-size: 1.1rem; margin: 4px 0 -4px; color: var(--soft); }

/* pictures */
.emo { line-height: 1; font-family: "Noto Color Emoji", "Apple Color Emoji", "Segoe UI Emoji", sans-serif; }
.sw { display: inline-block; border-radius: 50%; background: var(--c); border: 3px solid rgba(43,35,80,.2); }
.num { font-family: var(--display); font-weight: 800; line-height: 1; color: var(--lilac-d); font-variant-numeric: tabular-nums; }
.cal { display: inline-flex; flex-direction: column; border-radius: 10px; overflow: hidden; border: 3px solid var(--ink); background: #fff; font-family: var(--display); font-weight: 800; line-height: 1; }
.cal i { background: var(--red); color: #fff; font-style: normal; font-size: .4em; padding: .15em .5em; text-align: center; }
.cal b { padding: .12em .3em; font-size: .55em; text-align: center; }
.mean { display: inline-grid; place-items: center; background: #fff6d6; border: 3px dashed var(--sun-d); border-radius: 14px; padding: .25em .5em; font-family: var(--display); font-weight: 800; color: #7a5600; line-height: 1.1; text-align: center; max-width: 100%; }

/* play shell */
.prog { flex: 1; height: 16px; border-radius: 8px; background: var(--card); box-shadow: inset 0 2px 0 rgba(43,35,80,.08); overflow: hidden; }
.prog i { display: block; height: 100%; background: linear-gradient(90deg, var(--sun), #ffe27a); border-radius: 8px; transition: width .4s; }
.stage { background: var(--card); border-radius: 26px; box-shadow: 0 10px 24px rgba(91,75,196,.10); padding: 16px; display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center; position: relative; overflow: hidden; }
.ask { font-family: var(--display); font-weight: 800; font-size: 1.15rem; color: var(--soft); display: flex; align-items: center; gap: 8px; }
.ask .gi { font-size: 1.5rem; }
.bigpic { min-height: 110px; display: grid; place-items: center; }
.bigpic .emo { font-size: 6rem; }
.bigpic .sw { width: 100px; height: 100px; }
.bigpic .num { font-size: 5.5rem; }
.bigpic .cal { font-size: 6rem; }
.bigpic .mean { font-size: 1.9rem; padding: .4em .7em; }
.bigpic svg { width: 150px; height: 150px; }
.say { border: 0; background: var(--sky); color: #fff; border-radius: 999px; padding: 10px 20px; font-family: var(--display); font-weight: 800; font-size: 1.15rem; box-shadow: 0 8px 16px color-mix(in srgb, var(--sky-d) 35%, transparent); display: inline-flex; align-items: center; gap: 8px; }
.say:active { transform: scale(.97); }
.say.hero { width: 110px; height: 110px; border-radius: 50%; padding: 0; justify-content: center; font-size: 3.2rem; }
.say.sm { padding: 6px 12px; font-size: 1rem; }
.opts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; }
.opts.one { grid-template-columns: 1fr; }
.opt { border: 3px solid var(--line); background: #fff; border-radius: 18px; min-height: 64px; padding: 8px 10px; font-family: var(--display); font-weight: 800; font-size: 1.5rem; box-shadow: 0 8px 20px rgba(91,75,196,.10); overflow-wrap: anywhere; }
.opt:active { transform: scale(.97); }
.opt.ok { border-color: var(--mint); background: #dcf7ea; box-shadow: 0 8px 16px color-mix(in srgb, var(--mint) 35%, transparent); }
.opt.bad { border-color: var(--red); background: #ffe2e6; box-shadow: 0 8px 16px color-mix(in srgb, var(--red) 35%, transparent); }
.btn { border: 0; border-radius: 18px; padding: 12px 22px; font-family: var(--display); font-weight: 800; font-size: 1.3rem; color: #fff; background: var(--c, var(--lilac)); box-shadow: 0 10px 20px color-mix(in srgb, var(--d, var(--lilac-d)) 35%, transparent); }
.btn:active { transform: scale(.97); }
.btn.ghost { background: #fff; color: var(--ink); box-shadow: 0 10px 24px rgba(91,75,196,.10); border: 3px solid var(--line); }
.row2 { display: flex; gap: 10px; width: 100%; }
.row2 > * { flex: 1; }
.shake { animation: shake .4s; }
@keyframes shake { 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
.pop { animation: popin .35s; }
@keyframes popin { 50% { transform: scale(1.08); } }

/* balloons */
.sky { position: relative; width: 100%; height: 300px; border-radius: 20px; background: linear-gradient(#cdeeff, #f2fbff); overflow: hidden; }
.bal { position: absolute; bottom: 18px; width: 23%; border: 0; background: none; padding: 0; display: flex; flex-direction: column; align-items: center; animation: floaty 3s ease-in-out infinite; }
.bal .b { width: 100%; aspect-ratio: .82; border-radius: 50% 50% 48% 48% / 56% 56% 44% 44%; background: radial-gradient(circle at 32% 28%, rgba(255,255,255,.7) 0 10%, transparent 11%), var(--bc); display: grid; place-items: center; box-shadow: inset -6px -8px 0 rgba(0,0,0,.08); position: relative; }
.bal .b::after { content: ""; position: absolute; bottom: -7px; left: 50%; transform: translateX(-50%); border: 6px solid transparent; border-bottom: 8px solid var(--bc); border-top: 0; transform: translateX(-50%) rotate(180deg); }
.bal .s { width: 2px; height: 70px; background: #8aa0b4; }
.bal .emo { font-size: 2.3rem; }
.bal .mean { font-size: .78rem; padding: .2em .3em; border-width: 2px; }
.bal .sw { width: 42px; height: 42px; }
.bal .num { font-size: 2rem; color: #fff; }
.bal .cal { font-size: 2.6rem; }
.bal svg { width: 56px; height: 56px; }
.bal.popped { animation: popped .35s forwards; }
.bal.wrong .b { animation: shake .4s; }
.bal.hint .b { box-shadow: 0 0 0 5px #fff, 0 0 0 9px var(--mint); }
@keyframes floaty { 50% { transform: translateY(-14px); } }
@keyframes popped { to { transform: scale(1.6); opacity: 0; } }

/* moles */
.field { width: 100%; display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px 12px; padding: 8px 4px; border-radius: 20px; background: linear-gradient(#bfe8a8, #93d27a); }
.hole { position: relative; height: 104px; border: 0; background: none; padding: 0; overflow: hidden; }
.hole::after { content: ""; position: absolute; left: 6%; right: 6%; bottom: 0; height: 30px; border-radius: 50%; background: #5a3b22; }
.mole { position: absolute; left: 50%; bottom: 10px; transform: translate(-50%, 110%); width: 86%; transition: transform .35s cubic-bezier(.3,1.5,.6,1); z-index: 1; display: flex; flex-direction: column; align-items: center; }
.hole.up .mole { transform: translate(-50%, 0); }
.mole .face { width: 62px; height: 46px; border-radius: 50% 50% 0 0; background: #a56b3f; position: relative; }
.mole .face::before { content: "• •"; position: absolute; top: 9px; left: 0; right: 0; text-align: center; color: #2b2350; font-weight: 900; letter-spacing: 6px; }
.mole .face::after { content: ""; position: absolute; top: 24px; left: 50%; width: 14px; height: 9px; margin-left: -7px; border-radius: 50%; background: #ff8fa3; }
.mole .sign { background: #fff; border: 3px solid var(--ink); border-radius: 10px; padding: 1px 8px; font-family: var(--display); font-weight: 800; font-size: 1.15rem; margin-top: -4px; white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
.hole.hit .mole { transform: translate(-50%, 110%) scale(.9); transition-duration: .2s; }
.hole.miss .sign { border-color: var(--red); color: var(--red); }
.hole.hint .sign { border-color: var(--mint); background: #dcf7ea; }

/* memory */
.mem { width: 100%; display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; perspective: 600px; }
.mc { aspect-ratio: .78; border: 0; padding: 0; background: none; position: relative; transform-style: preserve-3d; transition: transform .35s; }
.mc.open, .mc.done { transform: rotateY(180deg); }
.mc .fc { position: absolute; inset: 0; border-radius: 14px; backface-visibility: hidden; display: grid; place-items: center; padding: 4px; }

  let ctx = null, out, nb, mus = null, musT = 0, step = 0;
  function init(){
    if (ctx) { if (ctx.state === 'suspended') ctx.resume().catch(() => {}); return true; }
    try { ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return false; }
    out = ctx.createGain(); out.gain.value = .7; out.connect(ctx.destination);
    nb = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate); const d = nb.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    return true;
  }
  function tone(f, t, dur, type = 'triangle', vol = .2, slide, dest){
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t); if (slide) o.frequency.exponentialRampToValueAtTime(slide, t + dur);
    g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + .01); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g); g.connect(dest || out); o.start(t); o.stop(t + dur + .05);
  }
  function noise(t, dur, f, vol){
    const s = ctx.createBufferSource(); s.buffer = nb; const bf = ctx.createBiquadFilter(); bf.type = 'bandpass'; bf.frequency.value = f; const g = ctx.createGain();
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur); s.connect(bf); bf.connect(g); g.connect(out); s.start(t); s.stop(t + dur);
  }
  const ok = () => S.set.sfx && init();
  const N = () => ctx.currentTime;
  // nhạc nền: hộp nhạc ngũ cung vui tươi
  const MEL = [72, 76, 79, 81, 79, 76, 74, 76, 72, 74, 76, 79, 76, 74, 72, 0, 74, 77, 81, 79, 77, 74, 72, 74, 76, 79, 81, 84, 81, 79, 76, 0];
  const BAS = [48, 0, 55, 0, 53, 0, 55, 0, 48, 0, 55, 0, 50, 0, 43, 0];
  const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
  let mg = null;
  function sched(){
    while (musT < ctx.currentTime + .25) {
      const d = .21, i = step % 32;
      if (MEL[i]) { tone(mtof(MEL[i]), musT, .5, 'sine', .07, null, mg); tone(mtof(MEL[i] + 12), musT, .25, 'triangle', .015, null, mg); }
      if (step % 2 === 0 && BAS[(step / 2) % 16]) tone(mtof(BAS[(step / 2) % 16]), musT, .4, 'sine', .08, null, mg);
      musT += d; step++;
    }
  }
  return {
    unlock: () => init(),
    tap(){ if (ok()) tone(900, N(), .05, 'sine', .07); },
    good(){ if (!ok()) return; const t = N(); tone(880, t, .1); tone(1320, t + .08, .25); tone(1760, t + .16, .3, 'sine', .08); },
    bad(){ if (QLOG) { freezeT(); later(showTranscript, 60); } if (!ok()) return; const t = N(); tone(330, t, .18, 'sine', .15, 220); tone(260, t + .15, .25, 'sine', .12, 180); },
    pop(){ if (!ok()) return; const t = N(); noise(t, .12, 2500, .5); tone(600, t, .12, 'sine', .15, 1400); },
    whack(){ if (!ok()) return; const t = N(); noise(t, .08, 800, .6); tone(200, t, .15, 'square', .08, 90); },
    flip(){ if (!ok()) return; const t = N(); noise(t, .09, 3500, .25); },
    boing(){ if (QLOG) { freezeT(); later(showTranscript, 60); } if (!ok()) return; const t = N(); tone(180, t, .35, 'sine', .2, 520); },
    tada(){ if (!ok()) return; const t = N(); [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, t + i * .1, i === 4 ? .7 : .2, 'triangle', .18)); for (let i = 0; i < 10; i++) tone(2000 + Math.random() * 2000, t + .5 + i * .05, .08, 'sine', .04); },
    sparkle(){ if (!ok()) return; const t = N(); for (let i = 0; i < 8; i++) tone(1500 + i * 180, t + i * .05, .15, 'sine', .06); },
    musicOn(){ if (!S.set.music || !S.set.sfx || !init() || mus) return; mg = ctx.createGain(); mg.gain.value = .8; mg.connect(out); musT = ctx.currentTime + .1; step = 0; mus = setInterval(sched, 80); },
    musicOff(){ if (mus) { clearInterval(mus); mus = null; } if (mg) { try { mg.gain.setTargetAtTime(0, ctx.currentTime, .1); } catch (e) {} mg = null; } }
  };
})();

const cvs = document.getElementById('confetti'), cx2 = cvs.getContext('2d');
let parts = [], craf = null;
function confetti(n = 80){
  cvs.width = innerWidth; cvs.height = innerHeight;
  const cols = ['#ff7a59', '#ffc93c', '#9b7bff', '#4fb3ff', '#2fbf8a', '#ff5a6e'];
  for (let i = 0; i < n; i++) parts.push({ x: innerWidth / 2 + (Math.random() - .5) * 120, y: innerHeight * .35, vx: (Math.random() - .5) * 12, vy: -Math.random() * 12 - 4, r: Math.random() * 6 + 4, c: pick(cols), a: Math.random() * 6, life: 90 + rnd(40) });
  if (!craf) loop();
  function loop(){
    cx2.clearRect(0, 0, cvs.width, cvs.height);
    parts.forEach(p => { p.vy += .35; p.x += p.vx; p.y += p.vy; p.a += .2; p.life--; cx2.save(); cx2.translate(p.x, p.y); cx2.rotate(p.a); cx2.fillStyle = p.c; cx2.fillRect(-p.r / 2, -p.r / 2, p.r, p.r * .6); cx2.restore(); });
    parts = parts.filter(p => p.life > 0 && p.y < cvs.height + 20);
    craf = parts.length ? requestAnimationFrame(loop) : (cx2.clearRect(0, 0, cvs.width, cvs.height), null);
  }
}

  if (scope && scope.length) { const r = similarFrom(w, n, scope); if (r.length >= n) return r; const r2 = similarFrom(w, n, classWords().filter(x => !r.includes(x))); return r.concat(r2).slice(0, n); }

  const sc = x => (x.en[0].toLowerCase() === w.en[0].toLowerCase() ? 3 : 0) + (x.t === w.t ? 2 : 0) - Math.abs(x.en.length - w.en.length) * .5 + Math.random() * 2;

}

        if (!wrong.length) { fin = true; okS.fill(true); draw(); Sfx.good(); speak(w.en, { rate: .8 }); cb(tries === 0); return; }

        const bad = new Set(wrong); draw(bad); slotsEl.classList.remove('shake'); void slotsEl.offsetWidth; slotsEl.classList.add('shake');
        if (tries >= 2) { fin = true; later(() => { tgt.forEach((c, k) => { if (!given[k]) { const j = bank.findIndex((b, jj) => b === c && !used().has(jj)); fill[k] = j >= 0 ? j : fill[k]; okS[k] = true; } }); draw(); speak(w.en, { rate: .75 }); }, 700); cb(false); return; }
        mochi('Sửa các ô màu đỏ nhé!', 'oops');
        later(() => { wrong.forEach(k => fill[k] = null); draw(); }, 800);
      }
      bankEl.onclick = e => { const b = e.target.closest('.tl'); if (!b || fin) return; const k = first(); if (k < 0) return; fill[k] = +b.dataset.j; Sfx.tap(); draw(); if (first() < 0) check(); };
      slotsEl.onclick = e => { const b = e.target.closest('.slot'); if (!b || fin) return; const k = +b.dataset.k; if (okS[k] || fill[k] === null) return; fill[k] = null; draw(); };
      on('undo', () => { if (fin) return; for (let k = fill.length - 1; k >= 0; k--) if (fill[k] != null && fill[k] >= 0 && !okS[k]) { fill[k] = null; break; } draw(); });
      on('hint', () => { if (fin) return; const k = tgt.findIndex((c, kk) => !given[kk] && !okS[kk]); if (k < 0) return; fill[k] = null; const u = used(); let j = bank.findIndex((b, jj) => b === tgt[k] && !u.has(jj)); if (j < 0) { const kk = fill.findIndex((f, m) => m !== k && !okS[m] && f != null && f >= 0 && bank[f] === tgt[k]); j = fill[kk]; fill[kk] = null; } fill[k] = j; okS[k] = true; tries = Math.max(tries, 1); Sfx.tap(); draw(); if (first() < 0) check(); });
      const play = () => speak(w.en, { rate: .75 }); play(); on('re', play);
      draw();
    },
    /* 🗣 Nói – nói to rồi tự kiểm tra */
    say(q, cb){
      const w = q.w;
      selfCheck({ head, done: cb }, '🗣 Bé <b>nói to</b> tên hình này bằng tiếng Anh nhé!', `<div class="bigpic">${pic(w)}</div>`, w.en, w.en, cb, [w.id]);
    },
    /* ✅ Nghe – đúng hay sai */
    tf(q, cb){
      const w = q.w, truth = Math.random() < .5, alt = truth ? w : others(w, 1, q.pool)[0];
      $app.innerHTML = head('🎧 Nghe Mochi đọc. <b>Đúng</b> với hình không?') +
        `<div class="stage"><div class="bigpic">${pic(w)}</div><button class="say hero" data-a="re">🔊</button>
         <div class="row2"><button class="btn" style="--c:var(--mint);--d:var(--mint-d);font-size:2rem" data-a="t">✓</button><button class="btn" style="--c:var(--red);--d:#d63a50;font-size:2rem" data-a="f">✗</button></div></div>`;
      const play = () => speak(alt.en, { rate: .8 }); later(play, 250); on('re', play);
      const ans = v => { const ok = v === truth; ok ? Sfx.good() : Sfx.bad(); if (!truth) later(() => speak(`It's ${w.en}.`), 300); $app.querySelectorAll('[data-a="t"],[data-a="f"]').forEach(b => b.disabled = true); cb(ok); };
      on('t', () => ans(true)); on('f', () => ans(false));
    },
    /* 🃏 Nghĩa – lật thẻ tìm cặp */
    memory(q, cb){
      const ws = q.ws, cards = shuffle(ws.flatMap(w => [{ w, k: 'p' }, { w, k: 'w' }]));
      $app.innerHTML = head('🃏 Lật 2 thẻ, tìm <b>hình và chữ</b> giống nhau!') +
        `<div class="stage"><div class="mem">${cards.map((c, j) => `<button class="mc" data-j="${j}"><span class="fc back">?</span><span class="fc front">${c.k === 'p' ? pic(c.w) : esc(c.w.en)}</span></button>`).join('')}</div></div>`;
      let open = [], miss = 0, matched = 0, lock = false;
      $app.querySelectorAll('.mc').forEach(b => b.onclick = () => {
        if (lock || b.classList.contains('open') || b.classList.contains('done')) return;
        const c = cards[+b.dataset.j]; b.classList.add('open'); Sfx.flip(); if (c.k === 'w') speak(c.w.en, { rate: .8 });
        open.push(b);
        if (open.length === 2) {
          const [a, d] = open.map(x => cards[+x.dataset.j]);
          if (a.w.id === d.w.id && a.k !== d.k) { open.forEach(x => { x.classList.add('done'); x.classList.remove('open'); }); open = []; matched++; Sfx.good(); speak(a.w.en, { rate: .8 });

        }
      });
    }
  };
  next();
}

function picCode(code, vi){
  const p = code || '';
  if (!p) return `<span class="mean">${esc(vi || '?')}</span>`;
  if (p.startsWith('yes:') || p.startsWith('no:')) { const y = p.startsWith('yes:'); return `<span class="badged">${picCode(p.slice(y ? 4 : 3), vi)}<i class="bdg ${y ? 'y' : 'n'}">${y ? '✓' : '✗'}</i></span>`; }
  if (p.startsWith('col:')) return `<span class="sw" style="--c:${p.slice(4)}"></span>`;
  if (p.startsWith('num:')) return `<span class="num">${p.slice(4)}</span>`;
  if (p.startsWith('cal:')) return `<span class="cal"><i>DAY</i><b>${p.slice(4)}</b></span>`;
  if (p.startsWith('shape:')) return shapeSvg(p.slice(6));
  if (p.startsWith('body:')) return bodySvg(p.slice(5));
  if (p.startsWith('prep:')) return prepSvg(p.slice(5));
  if (p.startsWith('obj:')) return objSvg(p.slice(4));
  if (p.startsWith('w:')) return `<svg class="wimg" viewBox="0 0 100 100" role="img" aria-label="${esc(vi || '')}"><image href="img/w/${p.slice(2)}.webp" width="100" height="100"/></svg>`;
  if (p.startsWith('d:')) return drawSvg(p.slice(2));
  if (p.startsWith('p:')) return personSvg(p.slice(2));
  if (p.startsWith('fig:')) return `<span class="figw">${fig(p.slice(4))}</span>`;
  return `<span class="emo">${p}</span>`;
}

function tilesUI(ctx, o){
  // o: talk, top, target (mảng), given (bool[]), extra, words, ids, sayText
  const tgt = o.target, given = o.given, bank = shuffle([...tgt.filter((c, k) => !given[k]), ...(o.extra || [])]);
  const fill = tgt.map((c, k) => given[k] ? -1 : null), okS = given.slice();
  let tries = 0, fin = false;
  const groups = []; if (o.words) groups.push(tgt.map((_, k) => k)); else { let cur = []; tgt.forEach((c, k) => { if (c === ' ') { groups.push(cur); cur = []; } else cur.push(k); }); groups.push(cur); }
  $app.innerHTML = ctx.head(o.talk) + `<div class="stage">${o.top || ''}<div class="slots ${o.words ? 'words' : ''}" id="slots" style="--L:${Math.max(...groups.map(g => g.length))}"></div></div>
    <div class="bank ${o.words ? 'words' : ''}" id="bank"></div><div class="tools"><button class="tool" data-a="undo">⌫ Xoá</button><button class="tool" data-a="hint">💡 Gợi ý</button></div>`;
  const slotsEl = document.getElementById('slots'), bankEl = document.getElementById('bank');
  const used = () => new Set(fill.filter(x => x != null && x >= 0));
  const first = () => fill.findIndex(x => x === null);
  function draw(bad){
    const fe = first();
    slotsEl.innerHTML = groups.map(g => `<span class="wd">${g.map(k => { const f = fill[k];
      if (given[k]) return `<span class="slot fixed">${esc(tgt[k])}</span>`;
      return `<button class="slot ${f === null ? (k === fe ? 'cur' : '') : okS[k] ? 'good' : bad && bad.has(k) ? 'bad' : 'f'}" data-k="${k}">${f === null ? '' : esc(bank[f])}</button>`; }).join('')}</span>`).join('');
    const u2 = used(); bankEl.innerHTML = bank.map((c, j) => `<button class="tl ${u2.has(j) ? 'used' : ''}" data-j="${j}">${esc(c)}</button>`).join('');
  }
  function check(){
    const wrong = tgt.map((c, k) => k).filter(k => !given[k] && bank[fill[k]] !== tgt[k]);
    if (!wrong.length) { fin = true; okS.fill(true); draw(); Sfx.good(); speak(o.sayText); ctx.done(tries === 0, o.ids); return; }
    tries++; Sfx.bad();
    tgt.forEach((c, k) => { if (!given[k] && !wrong.includes(k)) okS[k] = true; });
    draw(new Set(wrong)); slotsEl.classList.remove('shake'); void slotsEl.offsetWidth; slotsEl.classList.add('shake');
    if (tries >= 2) { fin = true; later(() => { const u2 = new Set(); tgt.forEach((c, k) => { if (!given[k]) { const j = bank.findIndex((b, jj) => b === c && !u2.has(jj)); u2.add(j); fill[k] = j; okS[k] = true; } }); draw(); speak(o.sayText); }, 700); ctx.done(false, o.ids); return; }
    mochi('Sửa các ô màu đỏ nhé!', 'oops');
    later(() => { wrong.forEach(k => fill[k] = null); draw(); }, 800);
  }
  bankEl.onclick = e => { const b = e.target.closest('.tl'); if (!b || fin) return; const k = first(); if (k < 0) return; fill[k] = +b.dataset.j; Sfx.tap(); draw(); if (first() < 0) check(); };
  slotsEl.onclick = e => { const b = e.target.closest('button.slot'); if (!b || fin) return; const k = +b.dataset.k; if (okS[k] || fill[k] === null) return; fill[k] = null; draw(); };
  on('undo', () => { if (fin) return; for (let k = fill.length - 1; k >= 0; k--) if (fill[k] != null && fill[k] >= 0 && !okS[k]) { fill[k] = null; break; } draw(); });
  on('hint', () => { if (fin) return; const k = tgt.findIndex((c, kk) => !given[kk] && !okS[kk]); if (k < 0) return; fill[k] = null; const u2 = used(); let j = bank.findIndex((b, jj) => b === tgt[k] && !u2.has(jj));
    if (j < 0) { const kk = fill.findIndex((f, m) => m !== k && !okS[m] && f != null && f >= 0 && bank[f] === tgt[k]); j = fill[kk]; fill[kk] = null; } fill[k] = j; okS[k] = true; tries = Math.max(tries, 1); Sfx.tap(); draw(); if (first() < 0) check(); });
  draw();
}

    document.getElementById('heard').innerHTML = `<span class="score s${st}">${r.score}</span><span>${'⭐'.repeat(st) || '💪'}<br><small>Mochi nghe được: “${esc(r.heard)}”</small></span>`;
    document.getElementById('after').hidden = false;
    if (r.score >= PASS) { Sfx.good(); mochi(st === 3 ? 'Phát âm chuẩn quá! 🌟' : st === 2 ? 'Giỏi lắm! Gần chuẩn rồi!' : 'Được rồi! Nghe Mochi đọc để nói hay hơn nữa nhé!', 'happy');
      later(() => speak(speakTxt, { rate: .85 }), 500); micb.querySelector('.ml').textContent = 'Nói lại cho hay hơn'; $app.querySelector('[data-a="nx"]').hidden = false; }
    else if (tries >= 3) { Sfx.bad(); mochi('Mình nghe Mochi đọc rồi luyện thêm lần sau nhé!', 'oops'); speak(speakTxt, { rate: .75 }); micb.hidden = true; $app.querySelector('[data-a="nx"]').hidden = false; }
    else { Sfx.boing(); mochi(`Nghe Mochi đọc rồi <b>nói lại</b> nhé! (còn ${3 - tries} lượt)`, 'oops'); speak(speakTxt, { rate: .75 }); micb.querySelector('.ml').textContent = 'Nói lại'; }
  };
  const asrst = document.getElementById('asrst');
  const showLoad = pct => { if (!document.body.contains(asrst)) return; asrst.hidden = pct >= 100; asrst.innerHTML = `⏳ Mochi đang chuẩn bị đôi tai (chỉ lần đầu, cần mạng)… <b>${pct}%</b><i style="width:${pct}%"></i>`; };
  if (useASR() && !asrFn) { asrOnProg = showLoad; showLoad(asrPct); loadASR().then(() => { asrst.hidden = true; }).catch(() => { asrst.hidden = true; const b = $app.querySelector('[data-a="rec"]'); if (b && CAN_REC) b.hidden = false; }); }
  const asrTurn = async () => {
    busy = true; stopSpeak(); micb.classList.add('on'); micb.querySelector('.ml').textContent = 'Mochi đang nghe… nói xong bấm dừng'; Sfx.tap();
    let rec;
    try { rec = await recordUtter(answer.split(' ').length > 3 ? 9000 : 6000); }
    catch (err) { micb.classList.remove('on'); busy = false; micb.querySelector('.ml').textContent = 'Bấm rồi nói'; micState = 'blocked'; mochi((MIC_ERR[err] || 'Máy này chưa thu âm được.') + ` <small>(mã: ${esc(String(err))})</small>`, 'oops'); later(() => selfCheckManual(ctx, talkTxt, topHtml, answer, speakTxt, cb, ids), 1800); return; }
    micb.classList.remove('on');
    if (!rec.blob || !rec.spoke) { busy = false; micb.querySelector('.ml').textContent = 'Bấm rồi nói'; mochi('Mochi chưa nghe thấy gì. Bé nói <b>to và rõ</b> hơn nhé!', 'oops'); return; }
    if (audioUrl) URL.revokeObjectURL(audioUrl); audioUrl = URL.createObjectURL(rec.blob); $app.querySelector('[data-a="mine"]').hidden = false;
    micb.querySelector('.ml').textContent = 'Mochi đang nghe lại…'; micb.disabled = true;
    try { const fn = await loadASR(); const text = await fn(await blobTo16k(rec.blob)); micb.disabled = false; busy = false;
      if (!document.body.contains(micb)) return; showResult(scoreSay(answer, [{ t: text }])); }
    catch (e) { micb.disabled = false; busy = false; asrFail = true; document.getElementById('after').hidden = false; micb.querySelector('.ml').textContent = 'Bấm rồi nói';
      mochi('Mochi chưa tải được đôi tai (cần mạng). Bé bấm 🔁 nghe lại giọng mình, rồi bấm 🎤 để Mochi chấm theo cách khác nhé!', 'oops'); }
  };
  on('mic', async () => { if (busy) { if (recStop) recStop(); return; } if (useASR()) return asrTurn(); busy = true; stopSpeak(); micb.classList.add('on'); micb.querySelector('.ml').textContent = 'Mochi đang nghe…'; Sfx.tap();
    try { const r = await listenOnce(answer.split(' ').length > 3 ? 8000 : 5000); micb.classList.remove('on'); busy = false;
      if (r.audio) { if (audioUrl) URL.revokeObjectURL(audioUrl); audioUrl = URL.createObjectURL(r.audio); $app.querySelector('[data-a="mine"]').hidden = false; }
      showResult(scoreSay(answer, r.alts)); }
    catch (err) { micb.classList.remove('on'); busy = false;
      if (err === 'no-speech' || err === 'aborted') { micb.querySelector('.ml').textContent = 'Bấm rồi nói'; mochi('Mochi chưa nghe thấy gì. Bé nói <b>to và rõ</b> hơn nhé!', 'oops'); return; }
      micState = 'blocked'; mochi((MIC_ERR[err] || 'Micro chưa dùng được ở đây.') + ` Giờ mình tự chấm nhé! <small>(mã: ${esc(String(err))})</small>`, 'oops');
      later(() => selfCheckManual(ctx, talkTxt, topHtml, answer, speakTxt, cb, ids), 1600); } });
  on('model', () => speak(speakTxt, { rate: .8 }));
  const playMine = () => { if (!audioUrl) return; stopSpeak(); try { const a = new Audio(audioUrl); a.play().catch(() => {}); } catch (e) {} };
  on('mine', playMine);
  on('rec', async b => { if (busy) return; if (recStop) { recStop(); return; } stopSpeak(); busy = true;
    b.textContent = '⏺ Đang thu… bấm để dừng'; b.classList.add('recon'); mochi('Bé nói lại thật to, Mochi thu để bé <b>nghe lại giọng mình</b> nhé!'); busy = false;
    try { const blob = await recordOnce(answer.split(' ').length > 3 ? 7000 : 4000); b.classList.remove('recon'); b.textContent = '🎙️ Thu lại';
      if (blob) { if (audioUrl) URL.revokeObjectURL(audioUrl); audioUrl = URL.createObjectURL(blob); $app.querySelector('[data-a="mine"]').hidden = false; later(playMine, 200); mochi('Nghe giọng mình rồi so với Mochi đọc nhé! 👂'); } }
    catch (err) { b.classList.remove('recon'); b.textContent = '🎙️ Thu giọng con'; mochi(MIC_ERR[err] || 'Máy này chưa thu âm được.', 'oops'); } });
  on('nx', () => cb(!!best && best.score >= PASS, ids));
  on('manual', () => selfCheckManual(ctx, talkTxt, topHtml, answer, speakTxt, cb, ids));
}
function stopSpeak(){ try { TTS && speechSynthesis.cancel(); } catch (e) {} }


/* ================= Hồ sơ từng bé ================= */
function kidStats(k){ let d = null; try { d = JSON.parse(localStorage.getItem(kidKey(k.id)) || 'null'); } catch (e) {}
  if (!d) return { stars: 0, known: 0, days: 0 }; return { stars: d.stars || 0, known: Object.values(d.w || {}).filter(s => s.b >= 3).length, days: Object.keys(d.log || {}).length }; }
function switchKid(id){ KIDS.cur = id; saveKids(); load(); }
function kidsScreen(edit){
  Sfx.musicOn();
  const form = k => `<div class="panel kform"><h3>${k ? '✏️ Sửa hồ sơ' : '➕ Thêm bé'}</h3>
      <input id="kn" class="kin" maxlength="16" placeholder="Tên của bé" value="${k ? esc(k.name) : ''}">
      <div class="avs">${AVS.map(a => `<button data-a="av" data-v="${a}" aria-pressed="${(k ? k.av : AVS[KIDS.list.length % AVS.length]) === a}">${a}</button>`).join('')}</div>
      <div class="seg"><button data-a="ksave" data-id="${k ? k.id : ''}">💾 Lưu</button>${k && KIDS.list.length > 1 ? `<button data-a="kdel" data-id="${k.id}" class="dangerb">🗑️ Xoá hồ sơ</button>` : ''}</div><p class="note" id="kmsg"></p></div>`;
  $app.innerHTML = topBar('Ai đang học?', 'Mỗi bé có tiến độ riêng') + talk('Chọn đúng tên của mình rồi học nhé! Sao, từ đã thuộc và cấp độ của mỗi bé được <b>lưu riêng</b>.') +
    `<div class="ulist">${KIDS.list.map(k => { const s = kidStats(k);
      return `<div class="kidrow ${k.id === KIDS.cur ? 'cur' : ''}"><button class="kidpick" data-a="pick" data-id="${k.id}"><span class="av">${k.av}</span><span class="tx"><b>${esc(k.name)}</b><small>⭐ ${s.stars} · 📚 ${s.known} từ thuộc · ${s.days} ngày học</small></span>${k.id === KIDS.cur ? '<span class="ust">✓</span>' : ''}</button><button class="ib" data-a="kedit" data-id="${k.id}" aria-label="Sửa">✏️</button></div>`; }).join('')}</div>
    ${edit === 'new' ? form(null) : edit ? form(KIDS.list.find(k => k.id === edit)) : `<button class="btn" style="--c:var(--mint);--d:var(--mint-d)" data-a="kadd" ${KIDS.list.length >= 8 ? 'disabled' : ''}>➕ Thêm bé</button>`}`;
  let av = edit && edit !== 'new' ? KIDS.list.find(k => k.id === edit).av : AVS[KIDS.list.length % AVS.length];
  on('pick', b => { switchKid(b.dataset.id); Sfx.good(); go(home); });
  on('kadd', () => go(kidsScreen, 'new'));
  on('kedit', b => go(kidsScreen, b.dataset.id));
  on('av', b => { av = b.dataset.v; $app.querySelectorAll('[data-a="av"]').forEach(x => x.setAttribute('aria-pressed', x === b)); Sfx.tap(); });
  on('ksave', b => { const name = document.getElementById('kn').value.trim().slice(0, 16); if (!name) { document.getElementById('kmsg').textContent = 'Nhập tên của bé nhé.'; return; }
    if (b.dataset.id) { const k = KIDS.list.find(x => x.id === b.dataset.id); k.name = name; k.av = av; saveKids(); go(kidsScreen); return; }
    let n = 2; while (KIDS.list.some(k => k.id === 'k' + n)) n++; const id = 'k' + n; try { localStorage.removeItem(kidKey(id)); } catch (e) {}
    KIDS.list.push({ id, name, av }); switchKid(id); Sfx.win ? Sfx.win() : Sfx.good(); go(home); });
  on('kdel', b => { if (!b.classList.contains('arm')) { b.classList.add('arm'); b.textContent = 'Bấm lần nữa: xoá hết tiến độ của bé này'; return; }
    const id = b.dataset.id; try { localStorage.removeItem(kidKey(id)); } catch (e) {} KIDS.list = KIDS.list.filter(k => k.id !== id); if (KIDS.cur === id) KIDS.cur = KIDS.list[0].id; saveKids(); load(); go(kidsScreen); });
}

/* ================= Báo cáo & sao lưu ================= */
function trackRes(key, ok, n){ S.sk = S.sk || {}; const t = today(), r = S.sk[key] || (S.sk[key] = {}); const a = r[t] || (r[t] = [0, 0]); a[0] += ok; a[1] += n;
  Object.keys(r).forEach(d => { if (+d < t - 90) delete r[d]; }); save(); }
function skAcc(key, days = 7){ const r = (S.sk || {})[key] || {}, t = today(); let ok = 0, n = 0; Object.keys(r).forEach(d => { if (+d > t - days) { ok += r[d][0]; n += r[d][1]; } }); return n ? { ok, n, p: ok / n } : null; }
function reportPanel(){
  const t = today(), DN = ['CN', 'T2', 'T3', 'T4', 'T5', 'T6', 'T7'];
  const days = [...Array(7)].map((_, k) => t - 6 + k), mx = Math.max(10, ...days.map(d => S.log[d] || 0));
  let wk = [0, 0]; days.forEach(d => { const a = (S.acc || {})[d]; if (a) { wk[0] += a[0]; wk[1] += a[1]; } });
  const bars = days.map(d => { const n = S.log[d] || 0, a = (S.acc || {})[d], p = a && a[1] ? a[0] / a[1] : null, dt = new Date(d * 864e5);
    return `<div class="bcol"><em>${n || ''}</em><i style="height:${(n / mx * 100).toFixed(0)}%;background:${p == null ? 'var(--line)' : p >= .8 ? 'var(--mint)' : p >= .6 ? 'var(--sun)' : 'var(--coral)'}"></i><small>${d === t ? 'Nay' : DN[dt.getUTCDay()]}</small></div>`; }).join('');
  const cell = (u, k) => { const st = [0, 1, 2].map(l => lvStars(u.id, k, l)), pass = st.filter(x => x >= 2).length, a = skAcc(u.id + ':' + k, 14);
    const cls = !a ? '' : a.p >= .8 ? 'g' : a.p >= .6 ? 'y' : 'r';
    return `<td class="${cls}"><b>${pass}/3</b>${a ? `<small>${Math.round(a.p * 100)}%</small>` : ''}</td>`; };
  // gợi ý
  let tip = '', worst = null;
  UNITS.forEach(u => SK.forEach(s => { const a = skAcc(u.id + ':' + s.k, 14); if (a && a.n >= 8 && (!worst || a.p < worst.a.p)) worst = { u, s, a }; }));
  const cu = curUnit(); const lag = SK.map(s => ({ s, pass: [0, 1, 2].filter(l => lvStars(cu.id, s.k, l) >= 2).length })).sort((a, b) => a.pass - b.pass)[0];
  if (worst && worst.a.p < .75) tip = `Kỹ năng <b>${worst.s.ic} ${worst.s.n}</b> ở <b>${worst.u.name}</b> bé mới đúng ${Math.round(worst.a.p * 100)}% trong 2 tuần qua – nên cho bé luyện lại cấp dễ hơn.`;
  else if (lag && lag.pass < 3) tip = `Ở <b>${cu.name}</b>, kỹ năng <b>${lag.s.ic} ${lag.s.n}</b> đang đi chậm nhất (${lag.pass}/3 cấp). Hôm nay cho bé làm phần này nhé.`;
  else tip = unitDone(cu.id) ? `Bé đã xong <b>${cu.name}</b>! Có thể chuyển sang Unit tiếp theo hoặc học từ vựng mở rộng.` : `Bé đã qua hết các cấp của <b>${cu.name}</b> – hãy làm bài <b>Kiểm tra</b> để mở phần mở rộng.`;
  const phN = PHG.filter(g => phDone(g.id)).length, swN = SWB.filter(b => phDone(b.id)).length;
  return `<div class="panel"><h3>📈 Báo cáo 7 ngày</h3>
    <div class="kpi"><div><b>${days.filter(d => S.log[d]).length}/7</b>ngày có học</div><div><b>${wk[0]}</b>câu đúng</div><div><b>${wk[1] ? Math.round(wk[0] / wk[1] * 100) + '%' : '–'}</b>tỉ lệ đúng</div></div>
    <div class="bars">${bars}</div><p class="note legend"><i style="background:var(--mint)"></i>đúng ≥80% <i style="background:var(--sun)"></i>60–80% <i style="background:var(--coral)"></i>&lt;60% · số = câu đã làm</p>
    <h3 style="font-size:1rem">Kỹ năng theo Unit <small class="note">(cấp đã qua · % đúng 2 tuần)</small></h3>
    <table class="rtab"><tr><th></th>${SK.map(s => `<th>${s.ic}<br>${s.n}</th>`).join('')}<th>🏆</th></tr>
      ${UNITS.map(u => `<tr><th>${u.name}</th>${SK.map(s => cell(u, s.k)).join('')}<td>${unitDone(u.id) ? '✅' : testOpen(u.id) ? '🔓' : '–'}</td></tr>`).join('')}</table>
    <div class="setrow"><span>🔤 Âm & Ghép vần</span><span>${phN}/${PHG.length} nhóm âm · ${swN}/${SWB.length} đợt sight words</span></div>
    <div class="tipbox">💡 ${tip}</div></div>`;
}
function backupCode(){ const j = JSON.stringify(S); const bytes = new TextEncoder().encode(j); let bin = ''; bytes.forEach(b => bin += String.fromCharCode(b)); return 'BOE1:' + btoa(bin); }
function readBackup(code){ try { const m = String(code).trim().replace(/\s+/g, '').match(/^BOE1:([A-Za-z0-9+/=]+)$/); if (!m) return null; const bin = atob(m[1]); const d = JSON.parse(new TextDecoder().decode(Uint8Array.from(bin, c => c.charCodeAt(0)))); return d && typeof d === 'object' && d.w && d.set ? d : null; } catch (e) { return null; } }
go(home);
})();
